<script>
const questions = [{"n": 1, "q": "'Imperialism, the Highest Stage of Capitalism' গ্রন্থটির লেখক কে?", "opts": {"A": "জে. এ. হবসন", "B": "ভি. আই. লেনিন", "C": "হিলফারডিং", "D": "অ্যাডাম স্মিথ"}, "correct": "B", "answer": "ভি. আই. লেনিন", "exp": "1916 সালে প্রকাশিত এই গ্রন্থে লেনিন সাম্রাজ্যবাদকে পুঁজিবাদের সর্বোচ্চ পর্যায় হিসেবে ব্যাখ্যা করেছেন।"}, {"n": 2, "q": "'সূর্যাস্ত আইন' (Sunset Law) কোন্ ভূমি বন্দোবস্তের সঙ্গে যুক্ত ছিল?", "opts": {"A": "চিরস্থায়ী বন্দোবস্ত", "B": "রায়তওয়ারি বন্দোবস্ত", "C": "মহলওয়ারি বন্দোবস্ত", "D": "ভাইয়াচারি ব্যবস্থা"}, "correct": "A", "answer": "চিরস্থায়ী বন্দোবস্ত", "exp": "লর্ড কর্ণওয়ালিস প্রবর্তিত এই আইনে নির্দিষ্ট দিনে সূর্যাস্তের আগে রাজস্ব জমা দিতে না পারলে জমিদারের জমিদারি বাজেয়াপ্ত হতো।"}, {"n": 3, "q": "ভারতে 'সাবসিডিয়ারি অ্যালায়েন্স' বা অধীনতামূলক মিত্রতা নীতি কে প্রবর্তন করেন?", "opts": {"A": "লর্ড ডালহৌসি", "B": "ওয়ারেন হেস্টিংস", "C": "লর্ড ওয়েলেসলি", "D": "লর্ড ক্যানিং"}, "correct": "C", "answer": "লর্ড ওয়েলেসলি", "exp": "ভারতীয় রাজন্যবর্গের অভ্যন্তরীণ বিষয়ে হস্তক্ষেপ ও ব্রিটিশ আধিপত্য বিস্তারের জন্য 1798 সালে ওয়েলেসলি এই নীতি চালু করেন। হায়দ্রাবাদের নিজাম প্রথম এই নীতি গ্রহণ করেন।"}, {"n": 4, "q": "'ক' স্তম্ভের সঙ্গে 'খ' স্তম্ভ মেলাও (প্রশাসক ও তাঁদের নীতি):\nস্তম্ভ 'ক': (i) লর্ড ওয়েলেসলি (ii) লর্ড ডালহৌসি (iii) লর্ড উইলিয়াম বেন্টিঙ্ক (iv) লর্ড কর্ণওয়ালিস\nস্তম্ভ 'খ': (a) সতীদাহ প্রথা নিবারণ (b) চিরস্থায়ী বন্দোবস্ত (c) অধীনতামূলক মিত্রতা নীতি (d) স্বত্ববিলোপ নীতি", "opts": {"A": "i-c, ii-d, iii-a, iv-b", "B": "i-a, ii-b, iii-c, iv-d", "C": "i-d, ii-c, iii-b, iv-a", "D": "i-c, ii-a, iii-d, iv-b"}, "correct": "A", "answer": "i-c, ii-d, iii-a, iv-b", "exp": "ওয়েলেসলি (অধীনতামূলক), ডালহৌসি (স্বত্ববিলোপ), বেন্টিঙ্ক (সতীদাহ রদ-1829), কর্ণওয়ালিস (চিরস্থায়ী)।"}, {"n": 5, "q": "'মুক্তদ্বার নীতি' (Open Door Policy) কোন্ দেশের ক্ষেত্রে ঘোষণা করা হয়েছিল?", "opts": {"A": "জাপান", "B": "ভারত", "C": "চীন", "D": "মিশর"}, "correct": "C", "answer": "চীন", "exp": "1899 সালে মার্কিন স্বরাষ্ট্রসচিব জন হে চীনে বিভিন্ন let index = 0;
let score = 0;
let answered = false;

const quiz = document.getElementById('quiz');
const finalBox = document.getElementById('final');
const bar = document.getElementById('bar');

function renderQuestion(){
  answered = false;
  const item = questions[index];
  bar.style.width = ((index) / questions.length * 100) + '%';
  const options = Object.entries(item.opts).map(([letter,text]) =>
    `<button class="option" data-letter="${letter}" onclick="choose(this,'${letter}')">
      <span class="letter">${letter}</span><span>${escapeHtml(text)}</span>
    </button>`).join('');
  quiz.innerHTML = `
    <div class="qnum">প্রশ্ন ${item.n} / ${questions.length}</div>
    <div class="question">${escapeHtml(item.q)}</div>
    <div>${options}</div>
    <div id="result" class="result"></div>
    <button id="next" class="next" onclick="nextQuestion()">${index === questions.length-1 ? 'ফলাফল দেখুন' : 'পরের প্রশ্ন →'}</button>
  `;
}

function choose(btn, letter){
  if(answered) return;
  answered = true;
  const item = questions[index];
  const all = document.querySelectorAll('.option');
  all.forEach(b => {
    b.classList.add('disabled');
    if(b.dataset.letter === item.correct) b.classList.add('correct');
  });
  const result = document.getElementById('result');
  if(letter === item.correct){
    score++;
    result.className = 'result show ok';
    result.innerHTML = `<div class="answer">✅ সঠিক উত্তর: (${item.correct}) ${escapeHtml(item.answer)}</div>
      <div class="explain">ব্যাখ্যা: ${escapeHtml(item.exp)}</div>`;
  } else {
    btn.classList.add('wrong');
    result.className = 'result show no';
    result.innerHTML = `<div class="answer">❌ আপনার উত্তর: (${letter}) ${escapeHtml(item.opts[letter])}</div>
      <div class="answer">সঠিক উত্তর: (${item.correct}) ${escapeHtml(item.answer)}</div>
      <div class="explain">ব্যাখ্যা: ${escapeHtml(item.exp)}</div>`;
  }
  document.getElementById('next').classList.add('show');
}

function nextQuestion(){
  index++;
  if(index < questions.length) renderQuestion();
  else showFinal();
}

function showFinal(){
  quiz.innerHTML = '';
  bar.style.width = '100%';
  finalBox.classList.add('show');
  const percent = Math.round(score / questions.length * 100);
  finalBox.innerHTML = `
    <div style="font-size:24px;font-weight:800">Quiz Complete 🎉</div>
    <div class="score">${score} / ${questions.length}</div>
    <div style="font-size:20px;font-weight:700">সঠিক উত্তর: ${score} টি</div>
    <div style="margin-top:8px;color:#cbd5e1">ভুল উত্তর: ${questions.length-score} টি</div>
    <div style="margin-top:8px;color:#94a3b8">Score: ${percent}%</div>
    <button class="restart" onclick="restartQuiz()">আবার শুরু করুন</button>
  `;
}

function restartQuiz(){
  index = 0; score = 0; finalBox.classList.remove('show'); renderQuestion();
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}
