<title>Student Care Academy - Education Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#07142e,#101b45,#07142e);color:#fff;font-family:'Noto Sans Bengali',sans-serif;min-height:100vh}
.container{max-width:850px;margin:auto;padding:16px}
.header{background:linear-gradient(135deg,#172b68,#0b1638);border:2px solid #d7b45a;border-radius:20px;padding:20px 14px;text-align:center;box-shadow:0 0 25px #0008;margin-bottom:16px}
.brand{font-size:25px;font-weight:800;color:#ffd75a;animation:glow 1.8s infinite alternate}
.teacher{font-size:18px;font-weight:700;color:#fff;margin-top:6px;animation:slide 2s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 4px #ffd75a}to{text-shadow:0 0 18px #ffd75a,0 0 30px #ffb300}}
@keyframes slide{from{transform:scale(.98)}to{transform:scale(1.02)}}
.meta{font-size:15px;color:#dbe6ff;margin-top:10px}
.progress{height:9px;background:#26345e;border-radius:10px;overflow:hidden;margin:14px 0}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#ffca28,#ff8f00);transition:.3s}
.card{background:#fff;color:#17213c;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0007}
.section{display:inline-block;background:#172b68;color:#ffd75a;padding:7px 12px;border-radius:20px;font-weight:700;font-size:14px;margin-bottom:12px}
.qno{font-size:17px;font-weight:800;color:#b07800;margin-bottom:8px}
.question{font-size:20px;line-height:1.65;font-weight:700;margin-bottom:18px}
.statement{background:#f3f6ff;border-left:4px solid #344c9c;padding:12px;border-radius:10px;margin:10px 0;line-height:1.7}
.options{display:grid;gap:11px;margin-top:15px}
.option{border:2px solid #d9deeb;border-radius:12px;padding:13px 14px;background:#fff;cursor:pointer;font-size:17px;line-height:1.5;transition:.2s}
.option:hover{border-color:#344c9c;background:#f5f7ff}
.option.selected{border-color:#d69e00;background:#fff6d8}
.option.correct{border-color:#168a4a;background:#dcf8e7}
.option.wrong{border-color:#c62828;background:#ffe0e0}
.matchbox{overflow-x:auto;background:#f8f9fd;border-radius:12px;padding:10px;margin:12px 0}
.matchbox table{width:100%;border-collapse:collapse;color:#18213d;min-width:520px}
.matchbox th,.matchbox td{border:1px solid #bcc5d8;padding:9px;text-align:left}
.matchbox th{background:#e6ebfa}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
button{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:800;cursor:pointer}
.prev{background:#e5e9f2;color:#17213c}.next{background:#172b68;color:#fff}.submit{background:#0d8b4d;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.explain{display:none;margin-top:14px;background:#fff8dc;border-left:4px solid #e0a800;padding:12px;border-radius:10px;line-height:1.65}
.result{display:none;text-align:center;background:#fff;color:#17213c;border-radius:20px;padding:28px;box-shadow:0 8px 28px #0008}
.score{font-size:48px;font-weight:900;color:#0d8b4d}
.result h2{color:#172b68}
.restart{background:#172b68;color:#fff;margin-top:14px}
.small{font-size:14px;color:#5e6880}
</style>
</head>
<body>
<div class="container">
  <div class="header">

  </div>
  <div id="quiz">
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="card">
      <div id="content"></div>
      <div class="nav">
        <button class="prev" id="prev" onclick="prevQ()">Previous</button>
        <button class="next" id="next" onclick="nextQ()">Next</button>
        <button class="submit" id="finish" onclick="finishQuiz()" style="display:none">Submit</button>
      </div>
    </div>
  </div>
  <div class="result" id="result">
    <h2>Quiz Completed</h2>
    <div class="score" id="score"></div>
    <p id="percent"></p>
    <p id="message"></p>
    <button class="restart" onclick="location.reload()">Try Again</button>
  </div>
</div>

{sec:"সাধারণ MCQ",q:"'অপারেশন ব্ল্যাকবোর্ড' কোন্ স্তরের শিক্ষার সাথে যুক্ত?",o:["প্রাক্-প্রাথমিক শিক্ষা","প্রাথমিক শিক্ষা","মাধ্যমিক শিক্ষা","উচ্চমাধ্যমিক শিক্ষা"],a:1,e:"১৯৮৬ সালের জাতীয় শিক্ষানীতিতে প্রাথমিক বিদ্যালয়ের ন্যূনতম পরিকাঠামো উন্নয়নের জন্য এই কর্মসূচি নেওয়া হয়।"},
{sec:"সাধারণ MCQ",q:"'DIET' প্রতিষ্ঠার সুপারিশ করা হয়েছিল—",o:["১৯৬৮ সালের জাতীয় শিক্ষানীতিতে","১৯৮৬ সালের জাতীয় শিক্ষানীতিতে","২০২০ সালের জাতীয় শিক্ষানীতিতে","সর্বশিক্ষা অভিযান, ২০০১"],a:1,e:"প্রাথমিক স্তরের শিক্ষকদের প্রশিক্ষণের জন্য ১৯৮৬ সালের শিক্ষানীতিতে প্রতিটি জেলায় DIET প্রতিষ্ঠার সুপারিশ করা হয়।"},
{sec:"সাধারণ MCQ",q:"সম্পূর্ণ বধির শিশুরা কত ডেসিবেলের বেশি শব্দ শুনতে পারে না?",o:["40","50","60","70"],a:3,e:"প্রদত্ত প্রশ্নব্যাংকের উত্তর অনুযায়ী উত্তর 70।"},
{sec:"সাধারণ MCQ",q:"ডেলরস্ কমিশনের প্রতিবেদনটির (1996) নাম কী?",o:["Education for All","Learning: The treasure within","Education for 21st century","Learning to be"],a:1,e:"UNESCO-র আন্তর্জাতিক শিক্ষা কমিশনের রিপোর্টের শিরোনাম ছিল Learning: The Treasure Within।"},

{sec:"সাধারণ MCQ",q:"'ল্যাবরেটরী স্কুল' (Laboratory School) কে প্রতিষ্ঠা করেন?",o:["রুশো","রবীন্দ্রনাথ","গান্ধীজী","জন ডিউই"],a:3,e:"জন ডিউই 1896 সালে শিকাগো বিশ্ববিদ্যালয়ে Laboratory School প্রতিষ্ঠা করেন।"},

{sec:"একাধিক বিবৃতি",q:"অন্তর্ভুক্তিমূলক শিক্ষা (Inclusive Education) প্রসঙ্গে সঠিক বিবৃতিগুলি হলো:",s:["i) বৈচিত্র্য একটি সম্পদ।","ii) শিক্ষার্থীদের দক্ষতার ওপর ভিত্তি করে তাদের পৃথক করা উচিত।","iii) সকল শিক্ষার্থীর মানসম্মত শিক্ষায় অংশগ্রহণের অধিকার আছে।"],o:["i ও ii সঠিক","i ও iii সঠিক","ii ও iii সঠিক","কেবল iii সঠিক"],a:1,e:"অন্তর্ভুক্তিমূলক শিক্ষায় বৈচিত্র্যকে সম্পদ হিসেবে দেখা হয় এবং সকলের অংশগ্রহণ নিশ্চিত করা হয়।"},
{sec:"একাধিক বিবৃতি",q:"রবীন্দ্রনাথ ঠাকুরের শিক্ষাদর্শন সম্পর্কিত সঠিক বিবৃতি:",s:["i) মাতৃভাষাই মাতৃদুগ্ধ— এটি তাঁর উক্তি।","ii) তিনি শ্রীনিকেতন প্রতিষ্ঠা করেছিলেন।","iii) তিনি নঈ-তালিম শিক্ষা প্রবর্তন করেন।"],o:["i ও ii সঠিক","কেবল ii সঠিক","i, ii, iii সঠিক","কেবল i সঠিক"],a:0,e:"শ্রীনিকেতন রবীন্দ্রনাথের সঙ্গে যুক্ত; নঈ-তালিমের প্রবর্তক গান্ধীজী।"},
{sec:"একাধিক বিবৃতি",q:"ডেলরস্ কমিশনের শিক্ষার চারটি স্তম্ভ হলো:",s:["i) জানার জন্য শিখন (Learning to know)","ii) কর্মসম্পাদনের জন্য শিখন (Learning to do)","iii) অর্থ উপার্জনের জন্য শিখন (Learning to earn)","iv) একত্রে বসবাসের জন্য শিখন (Learning to live together)"],o:["i, ii, iv সঠিক","i, ii, iii সঠিক","ii, iii, iv সঠিক","সবগুলি সঠিক"],a:0,e:"চারটি স্তম্ভ হলো Learning to know, Learning to do, Learning to live together এবং Learning to be।"},
{sec:"বিবৃতি-কারণ",q:"রুশোকে 'শিশুকেন্দ্রিক শিক্ষার জনক' বলা হয়।",r:"কারণ: তিনি তাঁর 'এমিল' গ্রন্থে প্রকৃতি নির্ভর এবং শিশুর চাহিদা অনুযায়ী শিক্ষার কথা বলেছিলেন, যাকে 'নেতিবাচক শিক্ষা' বলা হয়।",o:["A এবং R উভয়ই সত্য, এবং R হলো A-এর সঠিক ব্যাখ্যা।","A এবং R উভয়ই সত্য, কিন্তু R, A-এর সঠিক ব্যাখ্যা নয়।","A সত্য, কিন্তু R মিথ্যা।","A মিথ্যা, কিন্তু R সত্য।"],a:0,e:"রুশোর প্রকৃতিনির্ভর ও শিশুকেন্দ্রিক শিক্ষা-ভাবনা তাঁকে শিশুকেন্দ্রিক শিক্ষার অগ্রদূত করে।"},

 const x=qs[idx];
 let h=`<div class="section">${x.sec}</div><div class="qno">Question ${idx+1} of ${qs.length}</div><div class="question">${x.q}</div>`;
 if(x.s) h+=`<div class="statement">${x.s.join("<br>")}</div>`;
 if(x.r) h+=`<div class="statement"><b>Reason (R):</b> ${x.r}</div>`;
 if(x.m){
   h+=`<div class="matchbox"><table><tr><th>Column-I</th><th>Column-II</th></tr>`;
   x.m.forEach(row=>h+=`<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`);
   h+=`</table></div>`;
 }
 h+=`<div class="options">`;
 x.o.forEach((op,i)=>{
   let cls="";
   if(locked[idx]){
     if(i===x.a) cls="correct";
     else if(i===answers[idx]) cls="wrong";
   } else if(i===answers[idx]) cls="selected";
   h+=`<div class="option ${cls}" onclick="choose(${i})"><b>${String.fromCharCode(65+i)})</b> ${op}</div>`;
 });
