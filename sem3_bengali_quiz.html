<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Care Academy - Interactive Quiz</title>
<style>
:root{
  --gold:#f6c453; --gold2:#ffe28a; --bg:#06152b; --panel:#0b2343;
  --panel2:#102e55; --text:#fff; --muted:#b9c8dc; --green:#21c55d;
  --red:#ef4444; --blue:#1d4ed8;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text); font-family:"Noto Sans Bengali","Nirmala UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#153d6b 0,#06152b 42%,#020914 100%);
}
.header{
  text-align:center;padding:22px 12px 14px;position:sticky;top:0;z-index:10;
  background:rgba(2,9,20,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(246,196,83,.3)
}
.brand{
  font-size:clamp(23px,6vw,40px);font-weight:900;letter-spacing:.5px;color:#fff;
  text-shadow:0 0 8px rgba(246,196,83,.9),0 0 22px rgba(246,196,83,.45);
  animation:glow 1.8s ease-in-out infinite alternate
}
.teacher{font-size:clamp(16px,4vw,23px);margin-top:5px;color:var(--gold2);font-weight:700;animation:pulse 2.2s infinite}
@keyframes glow{from{transform:scale(1);text-shadow:0 0 7px var(--gold)}to{transform:scale(1.025);text-shadow:0 0 10px var(--gold),0 0 28px #ffdb70}}
@keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}
.progress{height:7px;border-radius:99px;background:#17304f;overflow:hidden;margin:4px 0 18px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#e7a91c,#ffe38b);transition:width .35s}
.quiz-card{
  background:linear-gradient(145deg,rgba(16,46,85,.97),rgba(6,24,47,.98));
  border:1px solid rgba(246,196,83,.38);border-radius:20px;padding:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.35)
}
.question-type{color:var(--gold2);font-weight:800;font-size:14px;margin-bottom:9px}
.question{font-size:clamp(18px,4.6vw,25px);line-height:1.65;font-weight:800;margin-bottom:18px}
.options{display:grid;gap:11px}
.option{
  width:100%;text-align:left;border:1px solid rgba(255,255,255,.2);border-radius:13px;
  background:linear-gradient(90deg,#102f59,#0b2445);color:#fff;padding:14px 15px;
  font-size:clamp(16px,4vw,20px);cursor:pointer;transition:.2s;line-height:1.5
}
.option:hover{transform:translateY(-1px);border-color:var(--gold)}
.option.disabled{cursor:default}
.option.correct{background:rgba(33,197,93,.2);border-color:var(--green)}
.option.wrong{background:rgba(239,68,68,.2);border-color:var(--red)}
.feedback{margin-top:16px;padding:13px 15px;border-radius:12px;font-size:17px;line-height:1.55;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(33,197,93,.12);border:1px solid rgba(33,197,93,.55)}
.feedback.no{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.55)}
.next{
  display:none;margin-top:15px;width:100%;border:0;border-radius:13px;padding:14px;
  background:linear-gradient(90deg,#e5a91f,#ffe083);color:#111;font-size:18px;font-weight:900;cursor:pointer
}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.match-box{
  border:1px solid rgba(246,196,83,.45);border-radius:12px;padding:12px;
  background:rgba(4,18,37,.6);font-size:16px;line-height:1.5
}
.match-title{font-weight:900;color:var(--gold2);margin-bottom:5px}
.result{
  display:none;text-align:center;background:linear-gradient(145deg,#0c2d53,#06172e);
  border:1px solid rgba(246,196,83,.55);border-radius:22px;padding:28px 18px;box-shadow:0 15px 40px rgba(0,0,0,.4)
}
.result.show{display:block}
.result h2{margin:0 0 8px;color:var(--gold2);font-size:30px}
.score{font-size:58px;font-weight:1000;color:#fff;text-shadow:0 0 18px rgba(246,196,83,.55)}
.percent{font-size:20px;color:var(--muted);margin-bottom:18px}
.restart{border:0;border-radius:12px;padding:13px 22px;background:var(--gold);font-weight:900;cursor:pointer}
.footer{text-align:center;color:#90a6c2;font-size:13px;margin-top:18px}
@media(max-width:560px){.quiz-card{padding:16px}.match-grid{grid-template-columns:1fr}.option{padding:12px}.question{line-height:1.55}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">Student Care Academy</div>
  <div class="teacher">Teacher:- Tapan Mandal</div>
</header>

<main class="wrap">
  <div class="progress"><div id="progress"></div></div>
  <section id="quiz"></section>
  <section id="result" class="result">
    <h2>কুইজ সম্পূর্ণ!</h2>
    <div class="score" id="score">0 / 90</div>
    <div class="percent" id="percent">মোট স্কোর: 0%</div>
    <button class="restart" id="restart">আবার শুরু করুন</button>
  </section>
  <div class="footer">Student Care Academy • Teacher:- Tapan Mandal</div>
</main>

  if([23,24,25,26,27,28,29,30,53,54,55,56,57,58,59,60,78,79,80,81,82,83,84,85,86,87,88,89].includes(current)) type='কেস স্টাডি / প্রয়োগভিত্তিক';

  let matchHtml='';
  if(item.match){
    matchHtml='<div class="match-grid">'+item.match.map((x,j)=>
      `<div class="match-box"><div class="match-title">${esc(x[0])}</div>${esc(x[1])}</div>`
    ).join('')+'</div>';
  }
  const options=item.opts.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join('');
  quiz.innerHTML=`
    <div class="quiz-card">
      <div class="question-type">${type}</div>
      <div class="question">${esc(item.q)}</div>
      ${matchHtml}
      <div class="options">${options}</div>
      <div id="feedback" class="feedback"></div>
      <button id="next" class="next">পরের প্রশ্ন</button>
    </div>`;
  document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>choose(+btn.dataset.i)));
  document.getElementById('next').addEventListener('click',next);
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered)return;
  answered=true;
  const item=QUESTIONS[current];
  const buttons=[...document.querySelectorAll('.option')];
  buttons.forEach((b,idx)=>{
    b.classList.add('disabled');
    if(idx===item.ans)b.classList.add('correct');
    if(idx===i && idx!==item.ans)b.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  if(i===item.ans){
    score++;
    fb.className='feedback show ok';
    fb.innerHTML='✓ সঠিক উত্তর — <strong>'+esc(item.correct)+'</strong>';
  }else{
    fb.className='feedback show no';
    fb.innerHTML='✗ ভুল উত্তর। সঠিক উত্তর — <strong>'+esc(item.correct)+'</strong>';
  }
  document.getElementById('next').style.display='block';
  document.getElementById('next').textContent=current===QUESTIONS.length-1?'ফলাফল দেখুন':'পরের প্রশ্ন';
}

function next(){
  if(current<QUESTIONS.length-1){current++;render();}
  else finish();
}

function finish(){
  quiz.style.display='none';
  progress.style.width='100%';
  result.classList.add('show');
  scoreEl.textContent=score+' / '+QUESTIONS.length;
  percentEl.textContent='মোট স্কোর: '+Math.round(score/QUESTIONS.length*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function restart(){
  current=0;score=0;answered=false;
  quiz.style.display='block';result.classList.remove('show');render();
}
document.getElementById('restart').addEventListener('click',restart);
render();
