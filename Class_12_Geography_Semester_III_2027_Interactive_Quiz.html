<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Care Academy - Class 12 Geography Semester III Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Noto Sans Bengali',sans-serif;
  background:linear-gradient(135deg,#071a3a,#102f68 45%,#071a3a);
  color:#fff;
  min-height:100vh;
}
.header{
  text-align:center;
  padding:22px 12px 14px;
  position:relative;
  overflow:hidden;
}
.brand{
  font-size:clamp(24px,6vw,42px);
  font-weight:800;
  color:#ffd54a;
  text-shadow:0 0 8px #ff9800,0 0 20px rgba(255,193,7,.7);
  animation:glow 1.7s infinite alternate, float 3s ease-in-out infinite;
}
.teacher{
  margin-top:5px;
  font-size:clamp(16px,4vw,22px);
  font-weight:700;
  color:#fff;
  animation:pulse 2s infinite;
}
.meta{
  margin-top:10px;
  color:#d9e7ff;
  font-size:14px;
}
@keyframes glow{from{transform:scale(1);text-shadow:0 0 6px #ff9800}to{transform:scale(1.03);text-shadow:0 0 8px #fff,0 0 22px #ff9800}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes pulse{50%{opacity:.72}}

.container{max-width:900px;margin:0 auto;padding:10px 14px 40px}
.progress-wrap{
  background:rgba(255,255,255,.14);
  border-radius:20px;
  height:12px;
  overflow:hidden;
  margin:8px 0 18px;
}
.progress{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#ffd54a);transition:.4s}

.card{
  background:#fff;
  color:#17233b;
  border-radius:22px;
  padding:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  animation:cardIn .35s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.qno{
  color:#0b5ed7;
  font-weight:800;
  font-size:15px;
  margin-bottom:10px;
}
.question{
  font-size:clamp(18px,4.5vw,23px);
  font-weight:700;
  line-height:1.65;
  margin-bottom:18px;
}
.option{
  display:block;
  width:100%;
  border:2px solid #dce5f2;
  background:#f8fbff;
  color:#17233b;
  border-radius:14px;
  padding:13px 14px;
  margin:10px 0;
  text-align:left;
  font-family:inherit;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}
.option:hover{border-color:#2674e8;background:#eef6ff;transform:translateX(2px)}
.option.selected{border-color:#0d6efd;background:#e8f2ff}
.option.correct{border-color:#198754;background:#dff6e8;color:#126b3d;font-weight:700}
.option.wrong{border-color:#dc3545;background:#ffe4e7;color:#a51f2b;font-weight:700}
.option:disabled{cursor:default;transform:none}

.feedback{
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  display:none;
  line-height:1.6;
}
.feedback.correct{display:block;background:#e7f8ee;border:1px solid #9bd8b2;color:#146c3c}
.feedback.wrong{display:block;background:#fff0f1;border:1px solid #efabb2;color:#9b1c27}

.answer{
  font-weight:800;
  margin-bottom:5px;
}
.explain{font-size:14px}

.next{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#0d6efd,#6610f2);
  color:#fff;
  font-family:inherit;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  display:none;
}
.next.show{display:block}
.next:hover{filter:brightness(1.1)}

.result{
  display:none;
  text-align:center;
  background:#fff;
  color:#17233b;
  border-radius:24px;
  padding:30px 20px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}
.result.show{display:block;animation:cardIn .5s ease}
.score{
  font-size:clamp(48px,12vw,78px);
  font-weight:900;
  color:#0d6efd;
  margin:10px 0;
}
.result h2{margin:0;color:#102f68}
.result p{font-size:17px}
.restart{
  margin-top:15px;padding:13px 24px;border:0;border-radius:12px;
  background:#198754;color:white;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;
}
.footer{text-align:center;color:#bdd0ee;font-size:13px;padding:20px}

@media(max-width:600px){
  .card{padding:17px}
  .option{font-size:15px;padding:12px}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">Student Care Academy</div>
  <div class="teacher">Teacher:- Tapan Mandal</div>
  <div class="meta">Class 12 | Geography | Semester-III | Exam Year 2027</div>
</header>

<main class="container">
  <div id="quizArea">
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    <div class="card" id="card"></div>
  </div>

  <div class="result" id="result">
    <h2>Quiz Completed!</h2>
    <div class="score" id="score"></div>
    <p id="resultText"></p>
    <p id="resultDetail"></p>
    <button class="restart" onclick="restartQuiz()">আবার Quiz দিন</button>
  </div>

  <div class="footer">Student Care Academy | Teacher:- Tapan Mandal</div>
</main>

<script>
const questions = [
{
q:"কার্স্ট অঞ্চলে গুহার ছাদ থেকে যে চুনাপাথরের স্তম্ভ নিচের দিকে ঝুলে থাকে, তাকে কী বলে?",
o:["স্ট্যালাগমাইট","স্ট্যালাকটাইট","হেলিকটাইট","পিলর"],a:1,
e:"চুনাপাথর যুক্ত অঞ্চলে গুহার ছাদ থেকে দ্রবীভূত চুন চুঁইয়ে পড়ে জমাট বেঁধে নিচের দিকে ঝুলতে থাকলে তাকে স্ট্যালাকটাইট বলে।"
},
{
q:"ডেভিসের স্বাভাবিক ক্ষয়চক্র তত্ত্বে বার্ধক্য পর্যায়ে সৃষ্ট তরঙ্গায়িত সমপ্রায় ভূমিকে কী বলা হয়?",
o:["প্যানপ্লেন","পেডিপ্লেন","পেনিপ্লেন","মোনাডনক"],a:2,
e:"নদীর ক্ষয়কার্যের শেষ পর্যায়ে উঁচু ভূমি ক্ষয়প্রাপ্ত হয়ে যে নিচু সমতল বা সামান্য তরঙ্গায়িত ভূমিতে পরিণত হয়, তাকে পেনিপ্লেন বা সমপ্রায় ভূমি বলে।"
},
{
q:"ক্রান্তীয় ঘূর্ণবাতের কেন্দ্রে শান্ত, মেঘমুক্ত ও বৃষ্টিহীন অঞ্চলকে কী বলা হয়?",
o:["ঘূর্ণবাতের চোখ","ঘূর্ণবাতের প্রাচীর","ট্রপোপজ","ফ্রন্ট"],a:0,
e:"ক্রান্তীয় ঘূর্ণবাতের একেবারে কেন্দ্রে বায়ুর চাপ সবচেয়ে কম থাকে এবং সেখানে আকাশ পরিষ্কার ও শান্ত থাকে, একেই ঘূর্ণবাতের চোখ (Eye of the cyclone) বলে।"
},
{
q:"এল নিনো (El Nino) বছরগুলিতে ভারতের জলবায়ুতে সাধারণত কী ধরনের প্রভাব লক্ষ্য করা যায়?",
o:["অতিবৃষ্টি ও বন্যা","স্বাভাবিক বৃষ্টিপাত","অনাবৃষ্টি ও খরা","প্রবল তুষারপাত"],a:2,
e:"এল নিনো প্রশান্ত মহাসাগরের পূর্ব উপকূলে উষ্ণ স্রোত সৃষ্টি করে, যার প্রভাবে ভারতের দক্ষিণ-পশ্চিম মৌসুমী বায়ু দুর্বল হয়ে পড়তে পারে এবং খরা পরিস্থিতি তৈরি হতে পারে।"
},
{
q:"'জীববৈচিত্র্য' (Biodiversity) কথাটি প্রথম কে ব্যবহার করেন?",
o:["নরম্যান মায়ার্স","ই. ও. উইলসন","ওয়াল্টার জি. রোজেন","এ. জি. ট্যান্সলে"],a:2,
e:"১৯৮৫ সালে বিজ্ঞানী ওয়াল্টার জি. রোজেন প্রথম 'Biodiversity' শব্দটি ব্যবহার করেন। পরবর্তীতে ই. ও. উইলসন এটি জনপ্রিয় করেন।"
},
{
q:"বিপন্ন ও লুপ্তপ্রায় জীবপ্রজাতির তালিকা যে বইতে প্রকাশ করা হয়, তাকে কী বলে?",
o:["গ্রিন ডাটা বুক","রেড ডাটা বুক","ব্ল্যাক ডাটা বুক","হোয়াইট ডাটা বুক"],a:1,
e:"আন্তর্জাতিক প্রকৃতি সংরক্ষণ সংঘ (IUCN) বিশ্বব্যাপী বিপন্ন প্রাণী ও উদ্ভিদের তালিকা রেড ডাটা বুক-এ প্রকাশ করে।"
},
{
q:"ওয়েবারের শিল্পস্থানিকতা তত্ত্বে সমপরিবহন ব্যয় যুক্ত রেখাকে কী বলা হয়?",
o:["আইসোটাইম","আইসোডাপেন","আইসোবার","আইসোহাইট"],a:1,
e:"কাঁচামাল এবং উৎপাদিত দ্রব্যের মোট পরিবহন ব্যয় যে সব স্থানে সমান, সেই স্থানগুলোকে যুক্ত করলে যে রেখা পাওয়া যায় তাকে আইসোডাপেন (Isodapane) বলে।"
},
{
q:"নিচের কোন শিল্পকে 'সকল শিল্পের মেরুদণ্ড' বা 'মৌলিক শিল্প' বলা হয়?",
o:["কার্পাস বয়ন শিল্প","পেট্রোরসায়ন শিল্প","লৌহ-ইস্পাত শিল্প","তথ্যপ্রযুক্তি শিল্প"],a:2,
e:"লৌহ-ইস্পাত শিল্পের উৎপাদিত দ্রব্যের ওপর নির্ভর করে অন্যান্য অসংখ্য ছোট-বড় শিল্প গড়ে ওঠে বলে একে সকল শিল্পের মেরুদণ্ড বলা হয়।"
},
{
q:"জনমিতিক রূপান্তর মডেলের (Demographic Transition Model) কোন পর্যায়ে জনসংখ্যা বৃদ্ধির হার সবচেয়ে বেশি (জনবিস্ফোরণ) থাকে?",
o:["প্রথম পর্যায়","দ্বিতীয় পর্যায়","তৃতীয় পর্যায়","চতুর্থ পর্যায়"],a:1,
e:"দ্বিতীয় পর্যায়ে চিকিৎসা ব্যবস্থার উন্নতির ফলে মৃত্যুহার দ্রুত কমে যায়, কিন্তু জন্মহার উচ্চ থাকে, ফলে জনসংখ্যা দ্রুত বৃদ্ধি পায়।"
},
{
q:"ভারতের মেগাসিটি (Megacity) হওয়ার জন্য কোনো শহরের ন্যূনতম জনসংখ্যা কত হতে হয়?",
o:["10 লক্ষ","20 লক্ষ","50 লক্ষ","1 কোটি"],a:2,
e:"ভারতের জনগণনা-ভিত্তিক প্রচলিত সংজ্ঞায় 50 লক্ষ বা তার বেশি জনসংখ্যার শহরকে মেগাসিটি বলা হয়।"
},
{
q:"উপকূলের সাথে সমান্তরালভাবে অবস্থিত শৈলশিরা সমুদ্রগর্ভে আংশিক নিমজ্জিত হয়ে যে উপকূল গঠন করে, তাকে কী বলে?",
o:["রিয়া উপকূল","ফিয়র্ড উপকূল","ডালমেশিয়ান উপকূল","যৌগিক উপকূল"],a:2,
e:"যুগোস্লাভিয়ার আড্রিয়াটিক সাগরের ডালমেশিয়ান উপকূল এর প্রকৃষ্ট উদাহরণ।"
},
{
q:"মৃত্তিকার 'A' স্তর থেকে 'B' স্তরে খনিজ পদার্থের ধৌত প্রক্রিয়ায় অপসারিত হওয়ার ঘটনাকে কী বলে?",
o:["ইলুভিয়েশন","এলুভিয়েশন","হিউমিফিকেশন","গ্লেইজেশন"],a:1,
e:"'A' স্তর থেকে খনিজ অপসারিত হওয়ার প্রক্রিয়াকে এলুভিয়েশন এবং 'B' স্তরে সেই খনিজ জমা হওয়ার প্রক্রিয়াকে ইলুভিয়েশন বলে।"
},
{
q:"নীল বিপ্লব (Blue Revolution) কথাটি নিচের কোন উৎপাদনের সাথে সরাসরি যুক্ত?",
o:["দুগ্ধ উৎপাদন","মৎস্য উৎপাদন","তৈলবীজ উৎপাদন","মাংস উৎপাদন"],a:1,
e:"জলজ সম্পদ, বিশেষ করে মাছ ও সামুদ্রিক খাদ্যের উৎপাদন বৃদ্ধিকে নীল বিপ্লব বলা হয়।"
},
{
q:"ছত্তিশগড় রাজ্যের প্রধান লৌহ-আকরিক খনি অঞ্চল কোনটি?",
o:["কোরবা","ভিলাই","বাইলাডিলা","রায়গড়"],a:2,
e:"ছত্তিশগড়ের বস্তার জেলার বাইলাডিলা ভারতের অন্যতম বৃহৎ ও উৎকৃষ্ট লৌহ-আকরিক খনি অঞ্চল।"
},
{
q:"'মেগালোপোলিস' (Megalopolis) শব্দটি প্রথম কে ব্যবহার করেন?",
o:["জ্যঁ গটম্যান","প্যাট্রিক গেডেস","মার্ক জেফারসন","লুইস মামফোর্ড"],a:0,
e:"1957 সালে ফরাসি ভৌগোলিক জ্যঁ গটম্যান যুক্তরাষ্ট্রের বোস্টন থেকে ওয়াশিংটন পর্যন্ত বিস্তৃত অতিকায় নগরপুঞ্জ বোঝাতে এই শব্দ ব্যবহার করেন।"
},
{
q:"সঠিক বিকল্পটি প্রশ্নসূচক স্থানে বসাও (Flowchart): অর্থনৈতিক কাজ → প্রাথমিক (কৃষি) → দ্বিতীয়ক (শিল্প) → তৃতীয়ক (?)",
o:["তথ্যপ্রযুক্তি","গবেষণা ও উন্নয়ন","পরিষেবা ও পরিবহন","পরামর্শদান"],a:2,
e:"তৃতীয়ক (Tertiary) অর্থনৈতিক কাজের মূল ভিত্তি হলো সমাজকে বিভিন্ন পরিষেবা প্রদান করা, যেমন—পরিবহন, বাণিজ্য, ব্যাংক ব্যবস্থা।"
},

let current=0, score=0, answered=false;

function renderQuestion(){
  answered=false;
  const q=questions[current];
  const card=document.getElementById('card');
  document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';
  card.innerHTML=`
    <div class="qno">Question ${current+1} of ${questions.length}</div>
    <div class="question">${q.q}</div>
    <div id="options">
      ${q.o.map((x,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}
    </div>
    <div id="feedback" class="feedback"></div>
    <button id="next" class="next" onclick="nextQuestion()">${current===questions.length-1?'Result দেখুন':'Next Question →'}</button>
  `;
}

function choose(i){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.a)b.classList.add('correct');
    if(idx===i && i!==q.a)b.classList.add('wrong');
  });
  const feedback=document.getElementById('feedback');
  if(i===q.a){
    score++;
    feedback.className='feedback correct';
    feedback.innerHTML=`<div class="answer">✓ সঠিক উত্তর</div><div>উত্তর: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</div><div class="explain">${q.e}</div>`;
  }else{
    feedback.className='feedback wrong';
    feedback.innerHTML=`<div class="answer">✗ ভুল উত্তর</div><div>সঠিক উত্তর: ${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</div><div class="explain">${q.e}</div>`;
  }
  document.getElementById('next').classList.add('show');
}

function nextQuestion(){
  current++;
  if(current<questions.length) renderQuestion();
  else showResult();
}

function showResult(){
  document.getElementById('quizArea').style.display='none';
  const result=document.getElementById('result');
  result.classList.add('show');
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('score').textContent=`${score} / ${questions.length}`;
  document.getElementById('resultText').textContent=`আপনার Percentage: ${pct}%`;
  document.getElementById('resultDetail').textContent=`সঠিক উত্তর: ${score} | ভুল উত্তর: ${questions.length-score}`;
}

function restartQuiz(){
  current=0;score=0;
  document.getElementById('quizArea').style.display='block';
  document.getElementById('result').classList.remove('show');
  renderQuestion();
}

renderQuestion();
</script>
