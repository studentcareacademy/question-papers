<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Care Academy - English Quiz</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, "Noto Sans Bengali", sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#173b72 0%,#07162f 45%,#020814 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.quiz-container{
    width:100%;
    max-width:850px;
    min-height:600px;
    background:rgba(4,18,43,.96);
    border:2px solid #d6a93a;
    border-radius:22px;
    box-shadow:
        0 0 20px rgba(255,193,7,.25),
        inset 0 0 30px rgba(30,100,180,.12);
    padding:20px;
    overflow:hidden;
}

/* Animated Header */

.brand{
    text-align:center;
    padding:10px 5px 20px;
}

.brand-title{
    font-size:clamp(22px,5vw,38px);
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(
        90deg,
        #ffd700,
        #ffffff,
        #00e5ff,
        #ffd700
    );
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:
        shine 4s linear infinite,
        glow 2s ease-in-out infinite alternate;
}

.brand-teacher{
    margin-top:8px;
    font-size:clamp(16px,3.5vw,23px);
    font-weight:bold;
    color:#fff;
    animation:fadeTeacher 2s ease-in-out infinite alternate;
}

@keyframes shine{
    0%{background-position:0% center;}
    100%{background-position:300% center;}
}

@keyframes glow{
    from{
        filter:drop-shadow(0 0 2px #ffd700);
    }
    to{
        filter:drop-shadow(0 0 12px #00e5ff);
    }
}

@keyframes fadeTeacher{
    from{opacity:.65;}
    to{
        opacity:1;
        text-shadow:0 0 12px #00e5ff;
    }
}

/* Progress */

.progress-area{
    width:100%;
    height:7px;
    background:#172744;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffd700,#00e5ff);
    transition:width .5s ease;
}

/* Question */

.question-box{
    background:linear-gradient(
        145deg,
        rgba(20,55,105,.95),
        rgba(7,25,55,.98)
    );
    border:1px solid rgba(255,215,0,.45);
    border-radius:18px;
    padding:25px 20px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    margin-bottom:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.question{
    font-size:clamp(19px,4vw,27px);
    line-height:1.5;
    font-weight:800;
}

/* Options */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.option{
    border:2px solid #49658e;
    background:linear-gradient(
        135deg,
        #102b52,
        #071b37
    );
    color:white;
    border-radius:14px;
    padding:17px 15px;
    min-height:65px;
    font-size:clamp(16px,3.5vw,20px);
    font-weight:600;
    cursor:pointer;
    transition:.25s;
    text-align:left;
}

.option:hover{
    border-color:#ffd700;
    transform:translateY(-2px);
    box-shadow:0 0 14px rgba(255,215,0,.25);
}

.option.selected{
    border-color:#00d9ff;
    background:#123e67;
}

.option.correct{
    background:linear-gradient(135deg,#075b3c,#0c8b59);
    border-color:#19ff9a;
}

.option.wrong{
    background:linear-gradient(135deg,#641d2a,#9b2639);
    border-color:#ff5268;
}

.option.disabled{
    cursor:default;
    pointer-events:none;
}

/* Feedback */

.feedback{
    min-height:55px;
    margin-top:18px;
    text-align:center;
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
}

.correct-text{
    color:#32ff9a;
    text-shadow:0 0 10px rgba(50,255,154,.4);
}

.wrong-text{
    color:#ff6878;
    text-shadow:0 0 10px rgba(255,80,100,.4);
}

/* Next */

.next-btn{
    display:none;
    width:100%;
    margin-top:12px;
    padding:15px;
    border:none;
    border-radius:13px;
    background:linear-gradient(90deg,#dcae19,#ffd84d);
    color:#07162f;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(255,215,0,.25);
    transition:.25s;
}

.next-btn:hover{
    transform:scale(1.02);
}

/* Result */

.result{
    display:none;
    text-align:center;
    padding:25px 10px;
}

.result h2{
    font-size:clamp(28px,7vw,48px);
    color:#ffd700;
    margin-bottom:20px;
    animation:resultGlow 1.5s infinite alternate;
}

@keyframes resultGlow{
    from{
        text-shadow:0 0 5px #ffd700;
    }
    to{
        text-shadow:
            0 0 10px #ffd700,
            0 0 25px #ff9d00;
    }
}

.score-circle{
    width:180px;
    height:180px;
    margin:20px auto;
    border-radius:50%;
    border:7px solid #ffd700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:radial-gradient(circle,#173b72,#06152d);
    box-shadow:0 0 30px rgba(255,215,0,.3);
}

.score-number{
    font-size:45px;
    font-weight:900;
    color:#fff;
}

.score-label{
    font-size:16px;
    color:#bcd4f5;
}

.result-message{
    font-size:20px;
    line-height:1.6;
    margin:20px 0;
    color:#e9f2ff;
}

.restart{
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#00b8e6,#00e5ff);
    color:#001426;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

/* Mobile */

@media(max-width:650px){
    .quiz-container{
        padding:14px;
        border-radius:17px;
    }

    .options{
        grid-template-columns:1fr;
        gap:10px;
    }

    .option{
        min-height:58px;
        padding:14px;
    }

    .question-box{
        padding:20px 15px;
    }
}
</style>
</head>

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

    answered = false;

    const data = questions[currentQuestion];

    questionEl.textContent = data.q;

    optionsEl.innerHTML = "";

    feedbackEl.innerHTML = "";

    nextBtn.style.display = "none";

    data.options.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.onclick = ()=>selectAnswer(index,button);

        optionsEl.appendChild(button);

    });

    progressBar.style.width =
        ((currentQuestion) / questions.length * 100) + "%";
}


function selectAnswer(selected,selectedButton){

    if(answered) return;

    answered = true;

    const correct = questions[currentQuestion].answer;

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach((button,index)=>{

        button.classList.add("disabled");

        if(index === correct){
            button.classList.add("correct");
        }

    });

    if(selected === correct){

        score++;

        selectedButton.classList.add("correct");

        feedbackEl.innerHTML =
            '<div class="correct-text">✓ সঠিক উত্তর!</div>';

    }else{

        selectedButton.classList.add("wrong");

        feedbackEl.innerHTML =
            '<div class="wrong-text">✗ ভুল উত্তর!</div>';

    }

    nextBtn.style.display = "block";

    if(currentQuestion === questions.length - 1){

        nextBtn.textContent = "ফলাফল দেখুন";

    }else{

        nextBtn.textContent = "Next Question →";

    }

}


nextBtn.addEventListener("click",()=>{

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

    }else{

        showResult();

    }

});


function showResult(){

    document.getElementById("quizScreen").style.display = "none";

    document.getElementById("result").style.display = "block";

    progressBar.style.width = "100%";

    document.getElementById("scoreNumber").textContent =
        score + " / " + questions.length;

    let message = "";

    const percentage =
        (score / questions.length) * 100;

    if(percentage >= 90){

        message =
        "অসাধারণ! আপনার প্রস্তুতি খুবই ভালো। 🎉";

    }else if(percentage >= 75){

        message =
        "খুব ভালো! আরও একটু অনুশীলন করলে ফল আরও ভালো হবে। 👏";

    }else if(percentage >= 50){

        message =
        "ভালো চেষ্টা! গুরুত্বপূর্ণ অংশগুলো আবার revise করুন। 📚";

    }else{

        message =
        "আরও অনুশীলন করুন এবং The Bet অধ্যায়টি আবার পড়ে quiz দিন। 💪";

    }

    document.getElementById("resultMessage").textContent =
        message;
}


function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    document.getElementById("quizScreen").style.display =
        "block";

    document.getElementById("result").style.display =
        "none";

    loadQuestion();

}


loadQuestion();

</script>
