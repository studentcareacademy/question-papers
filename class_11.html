<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Care Academy - Class 11 Bengali Quiz</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    font-family:'Noto Sans Bengali',sans-serif;
    background:
      radial-gradient(circle at top,#263b72 0%,#10182f 38%,#050914 100%);
    color:white;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:15px;
}

/* HEADER */
.header{
    text-align:center;
    padding:18px 10px;
    margin-bottom:15px;
    border:2px solid #e6c45a;
    border-radius:18px;
    background:linear-gradient(145deg,#101a38,#182652);
    box-shadow:0 0 25px rgba(255,211,75,.35);
}

.academy{
    font-size:28px;
    font-weight:800;
    color:#ffd84d;
    animation:glow 1.8s infinite alternate;
}

.teacher{
    font-size:19px;
    margin-top:5px;
    color:#ffffff;
    animation:slideGlow 2.5s infinite;
}

.classInfo{
    margin-top:8px;
    font-size:17px;
    color:#bde7ff;
}

@keyframes glow{
    from{
        text-shadow:0 0 5px #ffd84d;
        transform:scale(1);
    }
    to{
        text-shadow:0 0 25px #ffd84d,0 0 40px #ff9d00;
        transform:scale(1.025);
    }
}

@keyframes slideGlow{
    0%,100%{opacity:.7;}
    50%{opacity:1;text-shadow:0 0 15px #55d9ff;}
}

/* QUIZ CARD */
.quiz-card{
    background:linear-gradient(145deg,#111d3d,#172652);
    border:2px solid #394d84;
    border-radius:20px;
    padding:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.progress{
    height:9px;
    background:#263452;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffd43b,#ff8c00);
    transition:.4s;
}

.question{
    font-size:22px;
    line-height:1.65;
    font-weight:700;
    margin-bottom:20px;
    color:#fff;
}

.option{
    width:100%;
    display:block;
    padding:14px 16px;
    margin:11px 0;
    border:2px solid #536aa4;
    border-radius:14px;
    background:#182957;
    color:white;
    text-align:left;
    font-family:inherit;
    font-size:18px;
    cursor:pointer;
    transition:.25s;
}

.option:hover{
    background:#243a70;
    border-color:#ffd84d;
    transform:translateX(4px);
}

.option.correct{
    background:#145d45;
    border-color:#32e6a1;
}

.option.wrong{
    background:#702d35;
    border-color:#ff5964;
}

.option:disabled{
    cursor:not-allowed;
}

.answer-box{
    display:none;
    margin-top:20px;
    padding:17px;
    border-radius:15px;
    background:#0d1832;
    border:1px solid #536aa4;
}

.answer{
    color:#53f0ae;
    font-size:19px;
    font-weight:800;
    margin-bottom:8px;
}

.explanation{
    color:#e4e9f8;
    font-size:16px;
    line-height:1.75;
}

.next-btn{
    display:none;
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#ffca28,#ff8a00);
    color:#111;
    font-family:inherit;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.next-btn:hover{
    filter:brightness(1.1);
    transform:scale(1.01);
}

/* RESULT */
.result{
    display:none;
    text-align:center;
    padding:35px 20px;
    border-radius:20px;
    background:linear-gradient(145deg,#12244d,#1d3568);
    border:2px solid #ffd84d;
    box-shadow:0 0 30px rgba(255,216,77,.3);
}

.result h1{
    color:#ffd84d;
    font-size:30px;
}

.score{
    font-size:48px;
    font-weight:800;
    color:#53f0ae;
    margin:20px 0;
}

.result p{
    font-size:18px;
    line-height:1.7;
}

.restart{
    padding:13px 28px;
    border:none;
    border-radius:12px;
    background:#ffd43b;
    color:#111;
    font-family:inherit;
    font-weight:800;
    font-size:17px;
    cursor:pointer;
}

@media(max-width:600px){
    .academy{font-size:22px;}
    .teacher{font-size:16px;}
    .classInfo{font-size:14px;}
    .quiz-card{padding:16px;}
    .question{font-size:18px;}
    .option{font-size:16px;padding:12px;}
    .explanation{font-size:15px;}
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="academy">★ Student Care Academy ★</div>
        <div class="teacher">Teacher:- Tapan Mandal</div>
        <div class="classInfo">
            Class:- 11 &nbsp; | &nbsp; Semester:- 1 &nbsp; | &nbsp; Bengali
        </div>
    </div>

    <div class="quiz-card" id="quizCard">

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question" id="question"></div>

        <div id="options"></div>

        <div class="answer-box" id="answerBox">
            <div class="answer" id="answer"></div>
            <div class="explanation" id="explanation"></div>
        </div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            পরবর্তী প্রশ্ন ➜
        </button>

    </div>

    <div class="result" id="result">
        <h1>🎉 Quiz Completed! 🎉</h1>

        <div class="score" id="score"></div>

        <p id="resultText"></p>

        <button class="restart" onclick="restartQuiz()">
            আবার Quiz দিন
        </button>
    </div>

</div>

<script>

const questions = [

{
q:"'পুঁইমাচা' গল্পে সহায়হরি চাটুজ্যের জ্যেষ্ঠা কন্যার নাম কী?",
o:["দুর্গা","ক্ষেন্তি","রাধারাণী","আশালতা"],
a:1,
e:"বিভূতিভূষণ বন্দ্যোপাধ্যায়ের 'পুঁইমাচা' গল্পে সহায়হরি চাটুজ্যে ও অন্নপূর্ণার বড় মেয়ের নাম ক্ষেন্তি।"
},

{
q:"ক্ষেন্তির বয়স যখন এগারো-বারো, তখন তার শারীরিক গড়ন কেমন ছিল?",
o:["কৃশকায় ও দুর্বল","নাতিদীর্ঘ ও শ্যামলা","বেশ ডাগর-ডোগর ও দীর্ঘাঙ্গী","অত্যন্ত খর্বাকৃতি"],
a:2,
e:"পাঠ্যগল্পে উল্লেখ রয়েছে যে এগারো-বারো বছর বয়সেই ক্ষেন্তি বেশ ডাগর-ডোগর ও দীর্ঘাঙ্গী হয়ে উঠেছিল।"
},

{
q:"অন্নদা রায়ের বাড়ি হইতে সহায়হরি কি আনিয়াছিলেন?",
o:["পাকা পেঁপে","কাঁঠাল","একছড়া কাঁচকলা","পটোল ও পুঁইশাক"],
a:2,
e:"সহায়হরি রায়বাড়ির বাগান থেকে একটি কাঁঠাল ও একছড়া কাঁচকলা এনে স্ত্রীকে তরকারি রাঁধতে বলেছিলেন।"
},

{
q:"ক্ষেন্তি কিসের চচ্চড়ি খেতে সবচেয়ে বেশি ভালোবাসত?",
o:["সজনে ডাঁটা","পুঁইশাক","কুমড়ো শাক","পালং শাক"],
a:1,
e:"ক্ষেন্তির প্রিয় খাবার ছিল পুঁইশাকের চচ্চড়ি, যা সে নিজে পরম যত্নে মাচায় তুলেছিল।"
},

{
q:"ক্ষেন্তির শ্বশুরবাড়িতে তার ওপর নির্যাতনের প্রধান কারণ কী ছিল?",
o:["গৃহকর্মে অদক্ষতা","রূপের অভাব","প্রতিশ্রুত পণের গহনা ও অর্থ বাকি থাকা","গুরুজনদের অবাধ্য হওয়া"],
a:2,
e:"সহায়হরি চাটুজ্যে বিয়ের সময় প্রতিশ্রুত পণের টাকা ও গয়না সম্পূর্ণ মেটাতে না পারায় ক্ষেন্তিকে শ্বশুরবাড়িতে অমানুষিক গঞ্জনা সহ্য করতে হতো।"
},

{
q:"ক্ষেন্তি কোন রোগে আক্রান্ত হয়ে মারা গিয়েছিল?",
o:["ওলাউঠা","বসন্ত","ম্যালেরিয়া","যক্ষ্মা"],
a:1,
e:"শ্বশুরবাড়ি থেকে বাপের বাড়িতে আসার কিছুদিনের মধ্যেই ক্ষেন্তি গুটিবসন্ত রোগে আক্রান্ত হয়ে অকালে প্রাণ হারায়।"
},

{
q:"'বিড়াল' প্রবন্ধটি বঙ্কিমচন্দ্র চট্টোপাধ্যায়ের কোন মূল গ্রন্থ থেকে গৃহীত?",
o:["লোকরহস্য","কমলাকান্তের দপ্তর","মুচিরাম গুড়ের জীবনচরিত","বিবিধ প্রবন্ধ"],
a:1,
e:"'বিড়াল' বঙ্কিমচন্দ্রের ব্যঙ্গাত্মক ও সমাজভাবনামূলক রচনা 'কমলাকান্তের দপ্তর'-এর অন্তর্গত।"
},

{
q:"কমলাকান্ত আফিঙের ঝোঁকে নিজেকে কোন ঐতিহাসিক ব্যক্তিত্বের সঙ্গে তুলনা করছিলেন?",
o:["আলেকজান্ডার","জুলিয়াস সিজার","নেপোলিয়ন","ডিউক অব ওয়েলিংটন"],
a:2,
e:"কমলাকান্ত নিজেকে ফরাসি সম্রাট নেপোলিয়ন এবং ওয়াটারলু প্রান্তরে যুদ্ধরত সেনাপতি হিসেবে কল্পনা করছিলেন।"
},

{
q:"কমলাকান্তের জন্য রাখা দুধটুকু কে খেয়ে ফেলেছিল?",
o:["প্রসন্ন গোয়ালিনী","একটি মার্জার","মঙ্গলা গাই","নসীবাবুর চাকর"],
a:1,
e:"প্রসন্ন গোয়ালিনীর দেওয়া দুধটুকুর সদ্ব্যবহার করেছিল একটি ক্ষুধার্ত বিড়াল।"
},

{
q:"'মার্জার সুন্দরী' কমলাকান্তের কাছে দুধ খাওয়ার পর কেমন শব্দ করেছিল?",
o:["মিউ","হ্রেষা","ঘেউ","হিস"],
a:0,
e:"বিড়ালটি দুধ খেয়ে তৃপ্ত হয়ে অত্যন্ত শান্ত ও স্পষ্ট সুরে কমলাকান্তের দিকে তাকিয়ে 'মিউ' শব্দ করেছিল।"
},

{
q:"বিড়ালের মতে চোরের চেয়েও অধিক দোষী কে?",
o:["বিচারক","পাহারাওয়ালা","কৃপণ ধনী","রাজা"],
a:2,
e:"বিড়ালের সমাজতান্ত্রিক যুক্তিতে যে কৃপণ ধনী অঢেল সম্পদ থাকা সত্ত্বেও দরিদ্রের মুখে গ্রাস তুলে দেয় না, সে চোরের চেয়েও অধিক দোষী।"
},

{
q:"'কেহ মরিবে না, সকলে বাঁচিবে।'—এটি কার উক্তি?",
o:["কমলাকান্ত","প্রসন্ন","মার্জার","নসীবাবু"],
a:2,
e:"বিড়ালটি মনুষ্যজাতির উদ্দেশে সাম্যবাদী নীতি ব্যাখ্যা করতে গিয়ে এই কথা বলেছিল।"
},

{
q:"'ঈশ্বরচন্দ্র বিদ্যাসাগর' কবিতাটি মাইকেল মধুসূদন দত্ত কোথায় বসে রচনা করেছিলেন?",
o:["কলকাতা","লন্ডন","ভার্সাই নগরী","ঢাকা"],
a:2,
e:"১৮৬৫ সালে ফ্রান্সে অবস্থানকালে কবি ভার্সাই নগরে এই চতুর্দশপদী কবিতাটি রচনা করেন।"
},

{
q:"কবিতায় বিদ্যাসাগরের বিদ্যাবত্তাকে কার সঙ্গে তুলনা করা হয়েছে?",
o:["সুরধুনী","সিন্ধু","সুমেরু","হিমাদ্রি"],
a:3,
e:"কবি বিদ্যাসাগরের বিশাল পাণ্ডিত্য ও ব্যক্তিত্বকে ভারতের উত্তুঙ্গ পর্বতমালা হিমাদ্রির সঙ্গে তুলনা করেছেন।"
},

{
q:"'করুণার সিন্ধু তুমি, সেই জানে মনে'—এখানে 'করুণার সিন্ধু' বলতে কাকে বোঝানো হয়েছে?",
o:["রামমোহন রায়","দেবেন্দ্রনাথ ঠাকুর","ঈশ্বরচন্দ্র বিদ্যাসাগর","ডিরোজিও"],
a:2,
e:"ঈশ্বরচন্দ্র বিদ্যাসাগরের নিঃস্বার্থ পরোপকার ও দয়ার কথা স্মরণ করে কবি তাঁকে এই বিশেষণে ভূষিত করেছেন।"
},

{
q:"'সাম্যবাদী' কবিতাটি কাজী নজরুল ইসলামের কোন কাব্যগ্রন্থের অন্তর্ভুক্ত?",
o:["অগ্নিবীণা","বিষের বাঁশী","সর্বহারা","সাম্যবাদী"],
a:3,
e:"নজরুল ইসলামের 'সাম্যবাদী' কাব্যগ্রন্থের প্রথম কবিতাই হলো 'সাম্যবাদী'।"
},

{
q:"'যেখানে আসিয়া এক হয়ে গেছে সব বাধা-ব্যবধান'—সেই স্থানটি কী?",
o:["দেবালয়","মানুষের অন্তর বা হৃদয়","রাজপথ","শিক্ষাঙ্গন"],
a:1,
e:"কবি মানুষের পবিত্র হৃদয়কেই সব ধর্মের ও ভেদাভেদের ঊর্ধ্বে মহামিলনক্ষেত্র বলে ঘোষণা করেছেন।"
},

{
q:"'বিশাল ডানাওয়ালা এক থুত্থুরে বুড়ো' গল্পের মূল রচয়িতা কে?",
o:["আলবের কামু","গাব্রিয়েল গার্সিয়া মার্কেস","পাবলো নেরুদা","আর্নেস্ট হেমিংওয়ে"],
a:1,
e:"কলম্বিয়ান নোবেলজয়ী সাহিত্যিক গাব্রিয়েল গার্সিয়া মার্কেসের লেখা স্প্যানিশ গল্পের বাংলা রূপান্তর এটি।"
},

let current = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerBox = document.getElementById("answerBox");
const answerEl = document.getElementById("answer");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");
const quizCard = document.getElementById("quizCard");
const result = document.getElementById("result");
const scoreEl = document.getElementById("score");
const resultText = document.getElementById("resultText");

function loadQuestion(){

    answered = false;

    const item = questions[current];

    questionEl.innerHTML = item.q;

    optionsEl.innerHTML = "";

    answerBox.style.display = "none";
    nextBtn.style.display = "none";

    progressBar.style.width =
        ((current + 1) / questions.length * 100) + "%";

    item.o.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";
        button.innerHTML = option;

        button.onclick = ()=>selectAnswer(index,button);

        optionsEl.appendChild(button);

    });
}

function selectAnswer(index,clickedButton){

    if(answered) return;

    answered = true;

    const item = questions[current];

    const buttons = document.querySelectorAll(".option");

    buttons.forEach((button,i)=>{
        button.disabled = true;

        if(i === item.a){
            button.classList.add("correct");
        }
    });

    if(index === item.a){

        score++;

    }else{

        clickedButton.classList.add("wrong");

    }

    answerEl.innerHTML =
        "সঠিক উত্তর: " + item.o[item.a];

    explanationEl.innerHTML =
        "<b>ব্যাখ্যা:</b> " + item.e;

    answerBox.style.display = "block";

    if(current < questions.length - 1){

        nextBtn.style.display = "block";

    }else{

        nextBtn.innerHTML = "ফলাফল দেখুন ★";
        nextBtn.style.display = "block";

    }

}

function nextQuestion(){

    current++;

    if(current < questions.length){

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        showResult();

    }

}

function showResult(){

    quizCard.style.display = "none";

    result.style.display = "block";

    scoreEl.innerHTML =
        score + " / " + questions.length;

    let percentage =
        Math.round((score / questions.length) * 100);

    if(percentage >= 80){

        resultText.innerHTML =
        "অসাধারণ! 🔥 আপনার প্রস্তুতি খুব ভালো।<br>" +
        "প্রাপ্ত নম্বর: " + percentage + "%";

    }else if(percentage >= 60){

        resultText.innerHTML =
        "খুব ভালো! 👍 আরও একটু অনুশীলন করলে ফল আরও ভালো হবে।<br>" +
        "প্রাপ্ত নম্বর: " + percentage + "%";

    }else if(percentage >= 40){

        resultText.innerHTML =
        "ভালো চেষ্টা। 📚 গুরুত্বপূর্ণ অধ্যায়গুলো আরও একবার দেখে নিন।<br>" +
        "প্রাপ্ত নম্বর: " + percentage + "%";

    }else{

        resultText.innerHTML =
        "আরও অনুশীলন করুন। 💪 আবার Quiz দিন এবং নিজের প্রস্তুতি যাচাই করুন।<br>" +
        "প্রাপ্ত নম্বর: " + percentage + "%";

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function restartQuiz(){

    current = 0;
    score = 0;

    result.style.display = "none";
    quizCard.style.display = "block";

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

loadQuestion();

</script>
