<style>
*{box-sizing:border-box} body{margin:0;background:#080b14;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}
.brand{text-align:center;padding:18px 10px;margin-bottom:14px;border-radius:18px;background:linear-gradient(135deg,#101a3a,#24103f);box-shadow:0 0 25px #00d9ff55;overflow:hidden}
.brand h1{margin:0;font-size:clamp(22px,6vw,36px);animation:glow 1.8s infinite alternate}

.question{font-size:20px;line-height:1.65;margin-bottom:16px}

.result{display:none;text-align:center;padding:28px 15px}
.score{font-size:48px;font-weight:900;color:#ffd34e}
.small{opacity:.8;font-size:14px;margin-top:10px}

.progress{height:8px;background:#1c263b;border-radius:10px;overflow:hidden;margin:12px 0 18px}

<script>
const questions=[{"num": 1, "q": "স্পিনোজার মতে বিশ্বে দ্রব্যের সংখ্যা কয়টি?", "ans": "১ টি", "opts": ["৩ টি", "অসংখ্য", "১ টি", "২ টি"], "correct": 2}, {"num": 2, "q": "প্লেটোর মতে প্রকৃত জ্ঞান বলতে কী বোঝায়?", "ans": "ধারণার জ্ঞান বা বৌদ্ধিক জ্ঞান", "opts": ["ধারণার জ্ঞান বা বৌদ্ধিক জ্ঞান", "ইন্দ্রিয়গ্রাহ্য জ্ঞান", "কর্মের জ্ঞান", "শুধু স্মৃতির জ্ঞান"], "correct": 0}, {"num": 3, "q": "রামানুজের বেদান্ত দর্শন দর্শনের ইতিহাসে কী নামে পরিচিত?", "ans": "বিশিষ্টাদ্বৈতবাদ", "opts": ["দ্বৈতাদ্বৈতবাদ", "বিশিষ্টাদ্বৈতবাদ", "দ্বৈতবাদ", "শুদ্ধাদ্বৈতবাদ"], "correct": 1}, {"num": 4, "q": "অদ্বৈত বেদান্ত মতে মায়ার কয়টি শক্তি ও কী কী?", "ans": "২ টি - আবরণ শক্তি ও বিক্ষেপ শক্তি", "opts": ["১ টি - আবরণ শক্তি", "৩ টি - সৃষ্টিশক্তি, পালনশক্তি, লয়শক্তি", "২ টি - আবরণ শক্তি ও বিক্ষেপ শক্তি", "৪ টি - চার মহাশক্তি"], "correct": 2}, {"num": 5, "q": "'Deep Ecology' বা গভীর বাস্তুবিদ্যা শব্দটি প্রথম কে ব্যবহার করেন?", "ans": "আরনে নেস", "opts": ["আরনে নেস", "শংকরাচার্য", "হিউম", "পিটার সিঙ্গার"], "correct": 0}, {"num": 6, "q": "'Animal Liberation' নামক বিখ্যাত গ্রন্থটির রচয়িতা কে?", "ans": "পিটার সিঙ্গার", "opts": ["পিটার সিঙ্গার", "প্লেটো", "কার্ল মার্কস", "আরনে নেস"], "correct": 0}, {"num": 7, "q": "লকের মতে মানুষের মন জন্মের সময় কেমন থাকে?", "ans": "অলিখিত সাদা কাগজের মতো (Tabula Rasa)", "opts": ["শূন্য মস্তিষ্ক নয়, জন্মগতভাবে পরিপূর্ণ", "শুধু সহজাত ধারণায় পূর্ণ", "অলিখিত সাদা কাগজের মতো (Tabula Rasa)", "পরিপূর্ণ জ্ঞানসম্পন্ন"], "correct": 2}, {"num": 8, "q": "কান্টের জ্ঞানতত্ত্ব দর্শনের ইতিহাসে কী নামে পরিচিত?", "ans": "বিচারবাদ (Critical Philosophy)", "opts": ["অভিজ্ঞতাবাদ", "প্রকৃতিবাদ", "বিচারবাদ (Critical Philosophy)", "বুদ্ধিবাদ"], "correct": 2}, {"num": 9, "q": "দেকার্ত কোন্ পদ্ধতি প্রয়োগ করে তাঁর দর্শনের আলোচনা শুরু করেন?", "ans": "সংশয় পদ্ধতি (Method of Doubt)", "opts": ["পর্যবেক্ষণ পদ্ধতি", "সংশয় পদ্ধতি (Method of Doubt)", "ঐতিহাসিক পদ্ধতি", "সামাজিক পদ্ধতি"], "correct": 1}, {"num": 10, "q": "লাইবনিজ ঈশ্বরের অস্তিত্ব প্রমাণের জন্য প্রধানত কোন্ যুক্তির সাহায্য নিয়েছেন?", "ans" let idx=0, score=0, answered=false;
let attempts=Number(localStorage.getItem("philosophyQuizAttempts")||0);
document.getElementById("attempts").textContent=attempts;

function render(){
 answered=false;
 const x=questions[idx];
 document.getElementById("counter").textContent=`Question ${idx+1} / ${questions.length}`;
 document.getElementById("score").textContent=score;
 document.getElementById("bar").style.width=((idx/questions.length)*100)+"%";
 const isMatch=idx>=30 && idx<40;
 let matchHtml="";
 if(isMatch){
   const m=x.q.match(/স্তম্ভ-১ ও স্তম্ভ-২ মেলাও:\s*(.*)/);
   if(m) {
     const parts=m[1].split(";").map(s=>s.trim()).filter(Boolean);
     const left=parts.filter(p=>p.includes("->"));
     if(left.length) matchHtml='<div class="match">'+left.map(p=>{
       const [a,b]=p.split("->").map(s=>s.trim()); return `<div>${a}</div><div>${b}</div>`;
     }).join("")+'</div>';
   }
 }
 document.getElementById("card").innerHTML=`
   <div class="qno">Q${x.num}</div>
   ${matchHtml}
   <div class="question">${x.q}</div>
   <div class="options">${x.opts.map((o,i)=>`<button class="opt" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>
   <button class="next" id="next" onclick="nextQ()">${idx===questions.length-1?"Show Result":"Next Question"} →</button>`;
}
function choose(i){
 if(answered)return;
 answered=true;
 const x=questions[idx], buttons=document.querySelectorAll(".opt");
 buttons.forEach((b,n)=>{b.disabled=true;if(n===x.correct)b.classList.add("correct")});
 if(i===x.correct) score++; else buttons[i].classList.add("wrong");
 document.getElementById("score").textContent=score;
 document.getElementById("next").style.display="block";
}
function nextQ(){
 if(idx<questions.length-1){idx++;render();} else showResult();
}
function showResult(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("finalScore").textContent=`${score} / ${questions.length}`;
 document.getElementById("finalText").textContent=`Correct: ${score} | Wrong: ${questions.length-score}`;
 document.getElementById("bar").style.width="100%";
}
function restart(){
 attempts++;
 localStorage.setItem("philosophyQuizAttempts",attempts);
 idx=0;score=0;
 document.getElementById("result").style.display="none";
 document.getElementById("quiz").style.display="block";
 document.getElementById("attempts").textContent=attempts;
 render();
}
render();
</script>
