  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0a1128 0%, #000411 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Animated Header */
    .header-container {
      margin-bottom: 25px;
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    .animated-banner {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 14px 24px;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff8c00, #ffd700, #00d2ff, #ff8c00);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border: 2px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(0, 210, 255, 0.2);
      animation: gradientMove 6s ease infinite, glowPulse 2.5s ease-in-out infinite alternate;
      display: inline-block;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glowPulse {
      from {
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.2), inset 0 0 10px rgba(0, 210, 255, 0.2);
        transform: scale(1);
      }
      to {
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(0, 210, 255, 0.5);
        transform: scale(1.02);
      }
    }

    /* Quiz Container */
    .quiz-wrapper {
      width: 100%;
      max-width: 850px;
      background: rgba(8, 18, 48, 0.85);
      border: 2px solid #e0a924;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(224, 169, 36, 0.25);
      padding: 30px 25px;
      position: relative;
    }

    /* Question Frame */
    .question-box {
      background: linear-gradient(180deg, #0f2b5c 0%, #051430 100%);
      border: 2px solid #f5b027;
      border-radius: 12px;
      padding: 22px 20px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 0 15px rgba(245, 176, 39, 0.35);
      position: relative;
    }

    .question-text {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #f7f9fa;
      font-weight: 600;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    @media (max-width: 650px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .animated-banner {
        font-size: 1.1rem;
        padding: 10px 18px;
      }
      .question-text {
        font-size: 1.1rem;
      }
    }

    .option-btn {
      background: linear-gradient(180deg, #132d5e 0%, #061533 100%);
      border: 1.5px solid #dca725;
      color: #ffffff;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      outline: none;
      display: flex;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #244b96 0%, #0d2757 100%);
      border-color: #ffd700;
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .option-btn.correct {
      background: linear-gradient(180deg, #117a3b 0%, #084d23 100%) !important;
      border-color: #00ff66 !important;
      color: #ffffff !important;
      box-shadow: 0 0 20px #00ff66 !important;
      animation: correctFlash 0.5s ease 2;
    }

    .option-btn.incorrect {
      background: linear-gradient(180deg, #b31b1b 0%, #660f0f 100%) !important;
      border-color: #ff3333 !important;
      color: #ffffff !important;
      box-shadow: 0 0 20px #ff3333 !important;
    }

    @keyframes correctFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .progress-indicator {
      font-size: 0.95rem;
      color: #f1b739;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .next-btn {
      background: linear-gradient(180deg, #e69500 0%, #995700 100%);
      border: 1px solid #ffcc00;
      color: #fff;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
    }

    .next-btn:hover {
      background: linear-gradient(180deg, #ffaa00 0%, #b86900 100%);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.8);
    }

    /* Scoreboard */
    .result-screen {
      display: none;
      text-align: center;
      padding: 40px 10px;
    }

    .result-title {
      font-size: 2.2rem;
      color: #ffd700;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #102d68 0%, #061129 100%);
      border: 4px solid #f5b027;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      box-shadow: 0 0 30px rgba(245, 176, 39, 0.4);
    }

    .score-val {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
    }

    .score-max {
      font-size: 1rem;
      color: #9cb5db;
    }

    .feedback-msg {
      font-size: 1.25rem;
      color: #e0e8f5;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .restart-btn {
      background: linear-gradient(180deg, #009944 0%, #005c29 100%);
      border: 1px solid #00ff73;
      color: #fff;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 115, 0.4);
      transition: all 0.3s ease;
    }

    .restart-btn:hover {
      box-shadow: 0 0 25px rgba(0, 255, 115, 0.8);
      transform: translateY(-2px);
    }
  </style>
</head>

          "confined within narrow boundaries",
          "beautifully decorated",
          "globally recognized"
        ],
        answer: 1
      },
      {
        question: "What is an appropriate antonym for the word ‘tribulations’ in this context?",
        options: [
          "Hardships",
          "Joys",
          "Calamities",
          "Trials"
        ],
        answer: 1
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionTextEl = document.getElementById('question-text');
    const optionsContainerEl = document.getElementById('options-container');
    const nextBtnEl = document.getElementById('next-btn');
    const progressTextEl = document.getElementById('progress-text');

    const quizScreenEl = document.getElementById('quiz-screen');
    const resultScreenEl = document.getElementById('result-screen');
    const finalScoreEl = document.getElementById('final-score');
    const feedbackMsgEl = document.getElementById('feedback-msg');

    function loadQuestion() {
      const currentQ = quizData[currentQuestionIndex];
      questionTextEl.textContent = currentQ.question;
      optionsContainerEl.innerHTML = '';
      nextBtnEl.style.display = 'none';

      progressTextEl.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;

      currentQ.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optText;
        btn.onclick = () => selectOption(btn, index, currentQ.answer);
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, selectedIndex, correctIndex) {
      const allButtons = optionsContainerEl.querySelectorAll('.option-btn');
      allButtons.forEach(btn => btn.disabled = true);

      if (selectedIndex === correctIndex) {
        selectedBtn.classList.add('correct');
        score += 2; // Each question carries 2 marks (50 x 2 = 100)
      } else {
        selectedBtn.classList.add('incorrect');
        allButtons[correctIndex].classList.add('correct');
      }

      nextBtnEl.style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizScreenEl.style.display = 'none';
      resultScreenEl.style.display = 'block';
      finalScoreEl.textContent = score;

      let percentage = (score / 100) * 100;
      let feedback = "";

      if (percentage >= 90) {
        feedback = "Outstanding Performance! You have mastered the Semester-I syllabus completely.";
      } else if (percentage >= 75) {
        feedback = "Excellent work! Your grasp of the texts and grammar is commendable.";
      } else if (percentage >= 50) {
        feedback = "Good attempt! Regular revision of Shakespearean drama and grammar will improve your score.";
      } else {
        feedback = "Needs improvement. Review the core texts and practice textual grammar thoroughly.";
      }

      feedbackMsgEl.textContent = feedback;
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      resultScreenEl.style.display = 'none';
      quizScreenEl.style.display = 'block';
      loadQuestion();
    }

    // Initialize Quiz
    loadQuestion();
  </script>
</body>
</html>
