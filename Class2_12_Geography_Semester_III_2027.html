<script>const Q=[{"n": 1, "type": "সাধারণ MCQ", "q": "'পর্যায়ন' (Gradation) শব্দটি প্রথম কে ব্যবহার করেন?", "opts": ["চেম্বারলিন ও স্যালিসবেরি", "জি কে গিলবার্ট", "ডব্লিউ এম ডেভিস", "জে ডব্লিউ পাওয়েল"], "ans": 0, "exp": "অবরোহণ ও আরোহণ প্রক্রিয়ার সম্মিলিত ফল হলো পর্যায়ন, এই শব্দটি ১৯০৪ সালে চেম্বারলিন ও স্যালিসবেরি প্রথম ব্যবহার করেন।"}, {"n": 2, "type": "সাধারণ MCQ", "q": "ভাদোস (Vadose) স্তরের নিচে অবস্থিত স্থায়ী সম্পৃক্ত স্তরকে কী বলে?", "opts": ["কৈশিক স্তর", "মৃত্তিকা জল স্তর", "ফ্রিয়েটিক স্তর", "অ্যাকুইক্লুড"], "ans": 2, "exp": "ভূগর্ভস্থ জলের স্থায়ী সম্পৃক্ত স্তরকে ফ্রিয়েটিক (Phreatic) স্তর বলা হয়, যেখান থেকে সারা বছর জল পাওয়া যায়।"}, {"n": 3, "type": "Flowchart/ক্রম", "q": "কার্স্ট ভূমিরূপ সৃষ্টির সঠিক ক্রম বা প্রবাহচিত্র কোনটি?", "opts": ["সিঙ্কহোল → ডোলাইন → পোলজে → সোয়ালো হোল", "সোয়ালো হোল → সিঙ্কহোল → পোলজে → উভালা", "সিঙ্কহোল → সোয়ালো হোল → ডোলাইন → উভালা → পোলজে", "পোলজে → উভালা → ডোলাইন → সিঙ্কহোল"], "ans": 2, "exp": "চুনাপাথর যুক্ত অঞ্চলে দ্রবণ ক্ষয়ের ফলে গর্তগুলি ক্রমশ বড় হয়ে এই নির্দিষ্ট অনুক্রমে ভূমিরূপ গঠন করে।"}, {"n": 4, "type": "বিবৃতি-কারণ", "q": "বিবৃতি (A): ভূমধ্যসাগরীয় জলবায়ু অঞ্চলে শীতকালে বৃষ্টিপাত হয়।\nকারণ (R): শীতকালে এই অঞ্চল পশ্চিমা বায়ুর প্রভাব বলয়ে অবস্থান করে।", "opts": ["A ও R উভয়ই সত্য এবং R হলো A-এর সঠিক ব্যাখ্যা।", "A ও R উভয়ই সত্য কিন্তু R, A-এর সঠিক ব্যাখ্যা নয়।", "A সত্য কিন্তু R মিথ্যা।", "A মিথ্যা কিন্তু R সত্য।"], "ans": 0, "exp": "সূর্যের দক্ষিণায়নের ফলে চাপবলয়গুলি দক্ষিণে সরে গেলে ভূমধ্যসাগরীয় অঞ্চলে পশ্চিমা বায়ুর প্রভাবে শীতকালে বৃষ্টি হয়।"}, {"n": 5, "type": "সাধারণ MCQ", "q": "'ক্ষয়ের শেষ সীমা' (Base level of erosion) ধারণার প্রবর্তক কে?", "opts": ["ডব্লিউ এম ডেভিস", "জে ডব্লিউ পাওয়েল", "ওয়াল্টার পেঙ্ক", "এল সি কিং"], "ans": 1, "exp": "১৮৭৫ সালে জে ডব্লিউ পাওয়েল প্রথম ক্ষয়ের শেষ সীমা বা সমুদ্রতল ধারণার প্রবর্তন করেন।"}, {"n": 6, "type": "সাধারণ MCQ", "q": "রিয়া (Ria) উপকূল কিসের উদাহরণ?", "opts": ["উনমজ্জিত উপকূল", "নিমজ্জিত উপকূল", "যৌগিক উপকূল", "প্রবাল উপকূল"], "ans": 1, "exp": "নদী উপত্যকা সমুদ্রের জলে আংশিক নিমজ্জিত হয়ে রিয়া উপকূল গঠন করে, যেমন— আয়ারল্যান্ডের দক্ষিণ-পশ্চিম উপকূল।"}, {"n": 7, "type": "ম্যাচিং", "q": "সঠিক জোড়টি মেলাও:\nস্তম্ভ ১: (A) O স্তর, (B) A স্তর, (C) B স্তর\nস্তম্ভ ২: (1) ইলুভিয়েশন, (2) জৈব পদার্থ, (3) এলুভিয়েশন", "opts": ["A-2, B-3, C-1", "A-1, B-2, C-3", "A-3, B-1, C-2", "A-2, B-1, C-3"], "ans": 0, "exp": "O স্তর জৈব পদার্থ সমৃদ্ধ, A স্তর থেকে খনিজ পদার্থ ধৌত হয়ে নিচে যায় (এলুভিয়েশন) এবং B স্তরে জমা হয় (ইলুভিয়েশন)।"}, {"n": 8, "type": "একাধিক বিবৃতি", "q": "এল নিনো (El Nino) সম্পর্কিত কোন বিবৃতিগুলি সঠিক?\ni. এটি প্রশান্ত মহাসাগরে দেখা যায়।\nii. এর ফলে পেরু উপকূলে অনাবৃষ্টি হয়।\niii. এটি একটি উষ্ণ সমুদ্রস্রোত।", "opts": ["কেবল i ও ii", "কেবল i ও iii", "কেবল ii ও iii", "i, ii, ও iii সবকটি"], "ans": 1, "exp": "এল নিনো প্রশান্ত মহাসাগরের একটি উষ্ণ স্রোত, এর ফলে পেরু উপকূলে প্রচুর বৃষ্টিপাত হয় (অনাবৃষ্টি নয়)।"}, {"n": 9, "type": "সাধারণ MCQ", "q": "চারনোজেম মৃত্তিকা কোন বর্গের অন্তর্গত?", "opts": ["মলিসল (Mollisol)", "আলফিসল (Alfisol)", "অক্সিসল (Oxisol)", "স্পোডোসল (Spodosol)"], "ans": 0, "exp": "চারনোজেম বা কালো মাটি মলিসল বর্গের অন্তর্গত, যা জৈব পদার্থে অত্যন্ত সমৃদ্ধ।"}, {"n": 10, "type": "বিবৃতি-কারণ", "q": "বিবৃতি (A): ক্রান্তীয় ঘূর্ণবাতের কেন্দ্রে আকাশ পরিষ্কার ও শান্ত থাকে।\nকারণ (R): ঘূর্ণবাতের কেন্দ্রে বায়ুর চাপ সবচেয়ে বেশি থাকে।", "opts": ["A ও R উভয়ই সত্য এবং R হলো A-এর সঠিক ব্যাখ্যা।", "A ও R উভয়ই সত্য কিন্তু R, A-এর সঠিক ব্যাখ্যা নয়।", "A সত্য কিন্তু R মিথ্যা।", "A মিথ্যা কিন্তু R সত্য।"], "ans": 2, "exp": "ঘূর্ণবাতের কেন্দ্রে আকাশ শান্ত থাকে (যাকে 'চক্ষু' বলে), কিন্তু সেখানে বায়ুর চাপ সবচেয়ে কম থাকে, বেশি নয়।"}, {"n": 11, "type": "সাধারণ MCQ", "q": "নদীর স্বাভাবিক ক্ষয়চক্রের যৌবন পর্যায়ের একটি প্রধান ভূমিরূপ হলো—", "opts": ["প্লাবনভূমি", "অশ্বক্ষুরাকৃতি হ্রদ", "V-আকৃতির উপত্যকা", "মোনাডনক"], "ans": 2, "exp": "যৌবন পর্যায়ে নদীর নিম্নক্ষয় প্রবল হয়, ফলে V-আকৃতির উপত্যকা সৃষ্টি হয়।"}, {"n": 12, "type": "সাধারণ MCQ", "q": "চুনাপাথর ও বৃষ্টির জলের রাসায়নিক বিক্রিয়াকে কী বলে?" xtContent=p>=80?'দারুণ! আপনার প্রস্তুতি খুব ভালো।':p>=60?'ভালো হয়েছে। আরও একটু অনুশীলন করুন।':'আরও অনুশীলন করলে ফলাফল আরও ভালো হবে।'}$('go').onclick=start;$('next').onclick=next;$('again').onclick=()=>{$('result').classList.add('hidden');$('start').classList.remove('hidden');$('name').value=name};$('name').onkeydown=e=>{if(e.key==='Enter')start()};</script></body></html>
