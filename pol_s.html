let current=0,score=0;

let attempts=Number(localStorage.getItem("politicalScienceAttempts")||0)+1;
localStorage.setItem("politicalScienceAttempts",attempts);
document.getElementById("attempt").textContent=attempts;

function showQuestion(){

let q=questions[current];

let html=`
<div class="qno">Question ${current+1} / ${questions.length}</div>
<div class="question">${q[0]}</div>
`;

q[1].forEach((option,index)=>{
html+=`
<button class="option"
onclick="answer(${index},this)">
(${String.fromCharCode(65+index)}) ${option}
</button>`;
});

html+=`
<div id="feedback" class="feedback"></div>
<button id="next" class="next" onclick="nextQuestion()">
${current===questions.length-1?"View Result":"Next Question"} ➜
</button>
`;

document.getElementById("quiz").innerHTML=html;
}

function answer(selected,button){

let q=questions[current];
let buttons=document.querySelectorAll(".option");

buttons.forEach((b,index)=>{
b.disabled=true;
if(index===q[2]) b.classList.add("correct");
});

if(selected===q[2]){

score++;

document.getElementById("feedback").innerHTML=
"✅ সঠিক উত্তর!";

document.getElementById("feedback").style.color="#15803d";

}else{

button.classList.add("wrong");

document.getElementById("feedback").innerHTML=
"❌ ভুল উত্তর! সঠিক উত্তর: ("+
String.fromCharCode(65+q[2])+") "+q[1][q[2]];

document.getElementById("feedback").style.color="#b91c1c";
}

document.getElementById("next").style.display="inline-block";
}

function nextQuestion(){

current++;

if(current<questions.length){
showQuestion();
}else{
showResult();
}
}

function showResult(){

document.getElementById("quiz").classList.add("hidden");

let percentage=Math.round((score/questions.length)*100);

let message=
percentage>=80?"Excellent! 🎉":
percentage>=50?"Good Job! 👍":
"আরও Practice করুন! 💪";

document.getElementById("result").classList.remove("hidden");

document.getElementById("result").innerHTML=`

<h2>🎊 Exam Completed 🎊</h2>

<div class="score">
${score} / ${questions.length}
</div>

<h3>${message}</h3>

<p>Correct Answer: <b>${score}</b></p>
<p>Wrong Answer: <b>${questions.length-score}</b></p>
<p>Percentage: <b>${percentage}%</b></p>

<p>
<b>Exam Attempt: ${attempts}</b>
</p>

<button class="restart" onclick="location.reload()">
আবার পরীক্ষা দিন 🔄
</button>
`;
}

showQuestion();

</script>
