<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Student Care Academy - Quiz</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Noto Sans Bengali',sans-serif;
background:
radial-gradient(circle at top left,#172554,#07111f 45%,#020617);
color:#fff;
min-height:100vh;
}

.app{
width:100%;
max-width:900px;
margin:auto;
padding:14px;
}

/* HEADER */

.header{
position:relative;
overflow:hidden;
text-align:center;
padding:20px 12px;
border-radius:22px;
background:
linear-gradient(135deg,#0f172a,#172554,#1e1b4b);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 15px 45px rgba(0,0,0,.35);
margin-bottom:15px;
}

.brand{
font-size:25px;
font-weight:800;

background:
linear-gradient(
90deg,
#67e8f9,
#f0abfc,
#fde68a,
#67e8f9
);

background-size:300% auto;

-webkit-background-clip:text;

color:transparent;

animation:brandAnimation 5s linear infinite;
}

@keyframes brandAnimation{

0%{
background-position:0% center;
}

100%{
background-position:300% center;
}

}

.teacher{
color:#dbeafe;
font-size:14px;
font-weight:600;
margin-top:5px;
}

.classTitle{
color:#fde68a;
font-size:17px;
font-weight:800;
margin-top:7px;
}

.progressArea{
margin:10px 2px;
}

.progressText{
display:flex;
justify-content:space-between;
font-size:13px;
color:#cbd5e1;
margin-bottom:6px;
}

.progress{
height:8px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
}

.progressBar{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#22d3ee,
#818cf8,
#f472b6
);
transition:.3s;
}

/* CARD */

.card{
background:rgba(15,23,42,.94);
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
padding:20px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.section{
display:inline-block;
padding:6px 13px;
border-radius:30px;
background:
linear-gradient(
135deg,
#312e81,
#7c3aed
);
font-size:12px;
font-weight:800;
margin-bottom:12px;
}

.questionNo{
color:#67e8f9;
font-size:14px;
font-weight:800;
margin-bottom:8px;
}

.question{
font-size:19px;
font-weight:700;
line-height:1.75;
margin-bottom:17px;
}

.options{
display:grid;
gap:11px;
}

.option{
display:flex;
align-items:flex-start;
gap:10px;
padding:13px;
border-radius:14px;
border:1px solid #334155;
background:
linear-gradient(
135deg,
#111827,
#172033
);
cursor:pointer;
font-size:15px;
line-height:1.6;
transition:.2s;
}

.option:hover{
border-color:#38bdf8;
transform:translateY(-1px);
}

.option input{
display:none;
}

.letter{
width:30px;
height:30px;
min-width:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#1e293b;
color:#bae6fd;
font-weight:800;
}

.option.selected{
border-color:#22d3ee;
background:#164e63;
}

.option.selected .letter{
background:#06b6d4;
color:#082f49;
}

.option.correct{
border-color:#22c55e;
background:#14532d;
}

.option.wrong{
border-color:#ef4444;
background:#7f1d1d;
}

.next{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:14px;
background:
linear-gradient(
135deg,
#06b6d4,
#4f46e5
);
color:white;
font-family:inherit;
font-size:16px;
font-weight:800;
cursor:pointer;
}

.next:disabled{
opacity:.45;
cursor:not-allowed;
}

/* RESULT */

.result{
display:none;
text-align:center;
}

.resultIcon{
width:90px;
height:90px;
margin:5px auto 15px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
background:
linear-gradient(
135deg,
#22c55e,
#06b6d4
);
}

.resultTitle{
font-size:27px;
font-weight:800;
color:#fef3c7;
}

.scoreGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:20px 0;
}

.score{
background:#111827;
border:1px solid #334155;
border-radius:16px;
padding:15px;
}

.score small{
color:#94a3b8;
}

.score strong{
display:block;
font-size:27px;
color:#67e8f9;
margin-top:4px;
}

.restart{
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:
linear-gradient(
135deg,
#7c3aed,
#db2777
);
color:white;
font-family:inherit;
font-weight:800;
font-size:16px;
cursor:pointer;
}

/* MATCHING */

.matchGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:16px;
}

.matchBox{
border:1px solid #475569;
border-radius:14px;
overflow:hidden;
background:#0f172a;
}

.matchTitle{
text-align:center;
padding:8px;
background:#312e81;
font-weight:800;
}

.matchRow{
padding:9px;
border-top:1px solid #334155;
font-size:13px;
}

.footer{
text-align:center;
padding:18px 0 5px;
color:#64748b;
font-size:11px;
}

@media(max-width:600px){

.brand{
font-size:21px;
}

.question{
font-size:17px;
}

.option{
font-size:14px;
}

.matchGrid{
grid-template-columns:1fr 1fr;
}

.matchRow{
font-size:12px;
padding:8px;
}

}

</style>

</head>

</div>

</div>

<div class="footer">

let current=0;
let score=0;
let locked=false;

const quiz=
document.getElementById("quiz");

const result=
document.getElementById("result");

const progressBar=
document.getElementById("progressBar");

const currentEl=
document.getElementById("current");

const totalEl=
document.getElementById("total");

const sectionName=
document.getElementById("sectionName");

totalEl.textContent=
questions.length;


function render(){

locked=false;

let q=questions[current];

currentEl.textContent=
current+1;

sectionName.textContent=
q.section;

progressBar.style.width=
((current)/questions.length*100)+"%";

let html="";

html+=`
<div class="section">
${q.section}
</div>

<div class="questionNo">
Question ${current+1}
</div>

<div class="question">
${q.q}
</div>

<div class="options">
`;

q.o.forEach((option,i)=>{

let letter=
String.fromCharCode(65+i);

html+=`
<label class="option"
data-index="${i}">

<input
type="radio"
name="answer"
value="${i}">

<span class="letter">
${letter}
</span>

<span>
${option}
</span>

</label>
`;

});

html+=`
</div>

<button
class="next"
id="next"
disabled>

${current===questions.length-1
?"Finish Exam"
:"Next Question"}

</button>
`;

quiz.innerHTML=html;


document
.querySelectorAll(".option")
.forEach(option=>{

option.addEventListener(
"click",
()=>{

if(locked)return;

document
.querySelectorAll(".option")
.forEach(x=>
x.classList.remove("selected")
);

option.classList.add("selected");

option.querySelector("input")
.checked=true;

document.getElementById("next")
.disabled=false;

});

});


document
.getElementById("next")
.addEventListener(
"click",
check
);

}


function check(){

if(locked)return;

let selected=
document.querySelector(
'input[name="answer"]:checked'
);

if(!selected)return;

locked=true;

let chosen=
parseInt(selected.value);

let correct=
questions[current].a;

let options=
document.querySelectorAll(".option");

if(chosen===correct){

score++;

options[chosen]
.classList.add("correct");

}else{

options[chosen]
.classList.add("wrong");

options[correct]
.classList.add("correct");

}

let button=
document.getElementById("next");

button.disabled=false;

button.onclick=()=>{

if(current===
questions.length-1){

showResult();

}else{

current++;

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

};

}


function showResult(){

quiz.style.display="none";

document.getElementById(
"progressArea"
).style.display="none";

result.style.display="block";

progressBar.style.width="100%";

let key=
"StudentCareAcademyQuizAttempts";

let attempt=
parseInt(
localStorage.getItem(key)||"0"
);

attempt++;

localStorage.setItem(
key,
attempt
);

document.getElementById(
"finalScore"
).textContent=
score+" / "+questions.length;

document.getElementById(
"correct"
).textContent=
score;

document.getElementById(
"wrong"
).textContent=
questions.length-score;

document.getElementById(
"attempt"
).textContent=
attempt;

}


function restartQuiz(){

current=0;
score=0;
locked=false;

result.style.display="none";

quiz.style.display="block";

document.getElementById(
"progressArea"
).style.display="block";

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


render();

</script>
