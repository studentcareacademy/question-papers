<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Care Academy - Environmental Studies Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali","Nirmala UI",sans-serif;background:radial-gradient(circle at top,#15245b,#050914 70%);color:#fff;padding:18px}
.container{max-width:760px;margin:auto}
.header{text-align:center;padding:18px 12px 12px;margin-bottom:15px;border:1px solid #5366d9;border-radius:18px;background:linear-gradient(135deg,#101b45,#17286c);box-shadow:0 0 25px #263da855}
.brand{font-size:clamp(25px,6vw,42px);font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ffd54a,#fff,#55d6ff,#ffd54a);background-size:300% auto;-webkit-background-clip:text;color:transparent;animation:shine 4s linear infinite}
.teacher{font-size:18px;color:#dce4ff;margin-top:5px;font-weight:700}
@keyframes shine{to{background-position:300% center}}
.stats{display:flex;justify-content:space-between;gap:10px;margin:10px 0;color:#d8e1ff;font-weight:700}
.card{background:rgba(14,23,54,.96);border:1px solid #4256a9;border-radius:20px;padding:22px;box-shadow:0 15px 40px #0008}
.progress{height:8px;background:#25315e;border-radius:20px;overflow:hidden;margin-bottom:20px}
.progressbar{height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#48d9ff);transition:.35s}
.qno{color:#ffd54a;font-weight:900;font-size:18px;margin-bottom:12px}
.question{font-size:21px;line-height:1.65;font-weight:800;margin-bottom:20px}
.option{width:100%;text-align:left;border:1px solid #4a5ca5;background:#172247;color:white;padding:15px 16px;border-radius:13px;margin:8px 0;font-size:17px;cursor:pointer;transition:.2s}
.option:hover{transform:translateY(-1px);background:#22326b}
.option.correct{background:#116b45;border-color:#39e49a}
.option.wrong{background:#7c2430;border-color:#ff6577}
.option.disabled{cursor:default}
.feedback{min-height:32px;text-align:center;font-size:18px;font-weight:800;margin:14px 0}
.next{display:none;width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(90deg,#ffb300,#ffcf40);color:#111;font-size:18px;font-weight:900;cursor:pointer}
.result{display:none;text-align:center;padding:25px}
.score{font-size:48px;font-weight:900;color:#ffd54a;margin:12px}
.result button{border:0;padding:14px 25px;border-radius:13px;font-size:17px;font-weight:900;cursor:pointer;background:#55d6ff}
.small{color:#aebce8;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="container">
<header class="header">
  <div class="brand">Student Care Academy</div>
  <div class="teacher">Teacher:- Tapan Mandal</div>
  <div style="margin-top:8px;font-weight:700">Class: XII | Semester: III | Subject: Environmental Studies</div>
  <div style="color:#ffd54a;margin-top:6px;font-weight:900">Online Mock Test</div>
</header>

<div class="stats">
  <span id="count">Quiz Played: 0 times</span>
  <span id="liveScore">Score: 0</span>
</div>

<div class="card" id="quizCard">
  <div class="progress"><div class="progressbar" id="progress"></div></div>
  <div class="qno" id="qno"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="next">Next Question →</button>
</div>

<div class="card result" id="result">
  <div style="font-size:28px;font-weight:900">Quiz Completed 🎉</div>
  <div class="score" id="finalScore"></div>
  <div id="resultText"></div>
  <div class="small" id="attemptText"></div>
  <button onclick="startQuiz()">Play Again</button>
</div>
</div>

<script>
const questions = [{"q": "বাস্তুতন্ত্রে 'Gross Primary Productivity (GPP)' এবং 'Net Primary Productivity (NPP)'-এর মধ্যে সঠিক সম্পর্কটি কী?", "options": ["GPP = NPP + শ্বসন (Respiration)", "NPP = GPP + শ্বসন (Respiration)", "GPP = NPP × শ্বসন (Respiration)", "NPP = GPP / শ্বসন (Respiration)"], "answer": 0}, {"q": "পাথুরে বা শুষ্ক পরিবেশে (Xerosere) উদ্ভিদ পর্যায়ক্রমের (Ecological Succession) সূচনাকারী বা পাইওনিয়ার (Pioneer) প্রজাতি কোনটি?", "options": ["মস জাতীয় উদ্ভিদ (Bryophytes)", "ক্রাস্টোজ লাইকেন (Crustose Lichen)", "বিরুৎ জাতীয় উদ্ভিদ (Herbs)", "ফার্ন জাতীয় উদ্ভিদ"], "answer": 1}, {"q": "কোনো একটি নির্দিষ্ট সময়ে বাস্তুতন্ত্রের নির্দিষ্ট স্থানে উপস্থিত মোট অজৈব পুষ্টি উপাদানের (Inorganic nutrients) পরিমাণকে কী বলা হয়?", "options": ["Standing crop", "Standing state", "Biomass", "Net productivity"], "answer": 1}, {"q": "গভীর সমুদ্রের 'হাইড্রোথার্মাল ভেন্ট' (Hydrothermal Vent) বাস্তুতন্ত্রের শক্তির প্রাথমিক উৎপাদক কারা?", "options": ["ফাইটোপ্ল্যাঙ্কটন", "কেমোসিন্থেটিক ব্যাকটেরিয়া (Chemosynthetic bacteria)", "সায়ানোব্যাকটেরিয়া", "জুপ্ল্যাঙ্কটন"], "answer": 1}, {"q": "\"দুটি ভিন্ন প্রজাতি একই বাস্তুতান্ত্রিক নিচ (Ecological Niche) দীর্ঘকাল ধরে একসাথে শেয়ার করতে পারে না\"—এই নীতিটি কার?", "options": ["ওডাম (Odum)", "এলটন (Elton)", "গস (Gause - Competitive Exclusion Principle)", "হেকেল (Haeckel)"], "answer": 2}, {"q": "নিম্নলিখিত কোনটি পাললিক জীব-ভূরাসায়নিক চক্রের (Sedimentary cycle) উদাহরণ?", "options": ["নাইট্রোজেন চক্র", "কার্বন চক্র", "অক্সিজেন চক্র", "ফসফরাস চক্র"], "answer": 3}, {"q": "যে প্রজাতি বাস্তুতন্ত্রে সংখ্যায় কম থাকলেও তাদের অবলুপ্তির ফলে সমগ্র বাস্তুতন্ত্র ভেঙে পড়তে পারে, তাদের কী বলে?", "options": ["এন্ডেমিক প্রজাতি (Endemic Species)", "কিস্টোন প্রজাতি (Keystone Species)", "আমব্রেলা প্রজাতি (Umbrella Species)", "ইনডিকেটর প্রজাতি (Indicator Species)"], "answer": 1}, {"q": "ডিনাইট্রিফিকেশন (Denitrification) প্রক্রিয়ায় অংশগ্রহণকারী একটি ব্যাকটেরিয়া হলো:", "options": ["রাইজোবিয়াম (Rhizobium)", "নাইট্রোসোমোনাস (Nitrosomonas)", "সিউডোমোনাস (Pseudomonas)" let current=0, score=0, answered=false;
const key='sca_environment_quiz_plays';
let plays=Number(localStorage.getItem(key)||0);
document.getElementById('count').textContent='Quiz Played: '+plays+' times';

const letters=['A','B','C','D'];
function startQuiz(){
  current=0; score=0; answered=false;
  plays++; localStorage.setItem(key,plays);
  document.getElementById('count').textContent='Quiz Played: '+plays+' times';
  document.getElementById('quizCard').style.display='block';
  document.getElementById('result').style.display='none';
  document.getElementById('liveScore').textContent='Score: 0';
  showQuestion();
}
function showQuestion(){
  answered=false;
  const item=questions[current];
  document.getElementById('qno').textContent='Question '+(current+1);
  document.getElementById('question').textContent=item.q;
  document.getElementById('progress').style.width=((current)/questions.length*100)+'%';
  document.getElementById('feedback').textContent='';
  const box=document.getElementById('options'); box.innerHTML='';
  item.options.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.innerHTML='<b>'+letters[i]+'.</b> '+opt;
    b.onclick=()=>selectAnswer(i,b);
    box.appendChild(b);
  });
  document.getElementById('next').style.display='none';
}
function selectAnswer(index,clicked){
  if(answered) return;
  answered=true;
  const item=questions[current];
  const all=document.querySelectorAll('.option');
  all.forEach((b,i)=>{b.classList.add('disabled');if(i===item.answer)b.classList.add('correct')});
  if(index===item.answer){
    score++; clicked.classList.add('correct');
    document.getElementById('feedback').textContent='✓ সঠিক উত্তর! +1';
  }else{
    clicked.classList.add('wrong');
    document.getElementById('feedback').textContent='✗ ভুল উত্তর! সঠিক উত্তর: '+letters[item.answer]+'.';
  }
  document.getElementById('liveScore').textContent='Score: '+score;
  document.getElementById('next').style.display='block';
}
document.getElementById('next').onclick=()=>{
  current++;
  if(current<questions.length) showQuestion(); else finish();
};
function finish(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score+' / '+questions.length;
  const pct=Math.round(score/questions.length*100);
  document.getElementById('resultText').textContent='Your Score: '+pct+'%';
  document.getElementById('attemptText').textContent='এই কুইজটি আপনি মোট '+plays+' বার খেলেছেন।';
}
startQuiz();
</script>
