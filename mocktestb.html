<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Care Academy - Nutrition Quiz</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Noto Sans Bengali',sans-serif;
    background:
        radial-gradient(circle at top,#243b70 0%,#111936 45%,#070b18 100%);
    min-height:100vh;
    color:#fff;
    padding:15px;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

/* Animated Header */
.header{
    text-align:center;
    padding:18px 10px 20px;
    margin-bottom:15px;
    border-radius:18px;
    background:linear-gradient(135deg,#101d46,#192d65,#101936);
    border:2px solid #e9c46a;
    box-shadow:0 0 20px rgba(255,205,80,.25);
    overflow:hidden;
}

.academy{
    font-size:25px;
    font-weight:800;
    color:#ffd86b;
    letter-spacing:.5px;
    animation:
        glow 2s infinite alternate,
        slideIn 1.2s ease;
}

.teacher{
    margin-top:6px;
    font-size:18px;
    font-weight:600;
    color:#fff;
    animation:fadeTeacher 2s ease infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 5px #ffd86b;
        transform:scale(1);
    }
    to{
        text-shadow:
        0 0 8px #ffd86b,
        0 0 18px #ffb703,
        0 0 30px #ffb703;
        transform:scale(1.025);
    }
}

@keyframes slideIn{
    from{
        transform:translateY(-30px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes fadeTeacher{
    from{opacity:.65;}
    to{opacity:1;}
}

/* Subject */
.subject{
    text-align:center;
    background:rgba(255,255,255,.08);
    padding:10px;
    border-radius:12px;
    margin-bottom:15px;
    border:1px solid rgba(255,255,255,.2);
    font-size:16px;
    font-weight:600;
}

/* Quiz Card */
.quiz-card{
    background:linear-gradient(145deg,#121d40,#0d1530);
    border-radius:22px;
    padding:20px;
    border:2px solid rgba(255,210,90,.65);
    box-shadow:0 10px 35px rgba(0,0,0,.45);
}

.progress{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    font-size:15px;
    color:#ffd86b;
    font-weight:700;
}

.progress-bar{
    width:100%;
    height:8px;
    background:#252d4d;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:18px;
}

.progress-fill{
    height:100%;
    width:2%;
    background:linear-gradient(90deg,#ffb703,#ffd166,#fff3b0);
    transition:width .4s ease;
}

.question{
    background:linear-gradient(135deg,#1d2d5b,#162347);
    border-radius:16px;
    padding:18px;
    font-size:18px;
    line-height:1.8;
    font-weight:600;
    border-left:5px solid #ffd166;
    margin-bottom:18px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px 16px;
    background:linear-gradient(135deg,#202e58,#172344);
    color:#fff;
    text-align:left;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.18);
    transition:all .25s ease;
}

.option:hover:not(:disabled){
    transform:translateX(5px);
    background:linear-gradient(135deg,#314778,#253863);
    border-color:#ffd166;
}

.option.correct{
    background:linear-gradient(135deg,#087f5b,#0b5d45);
    border-color:#53f2bd;
    box-shadow:0 0 15px rgba(83,242,189,.3);
}

.option.wrong{
    background:linear-gradient(135deg,#a61e35,#711426);
    border-color:#ff7186;
    box-shadow:0 0 15px rgba(255,80,110,.25);
}

.option:disabled{
    cursor:not-allowed;
}

.answer-box{
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    display:none;
    line-height:1.7;
    font-size:15px;
}

.answer-box.show{
    display:block;
}

.answer-box.correct-msg{
    background:rgba(20,160,110,.16);
    border:1px solid #36d99c;
    color:#7dffd0;
}

.answer-box.wrong-msg{
    background:rgba(200,30,55,.15);
    border:1px solid #ff647c;
    color:#ffacb9;
}

.next-btn{
    display:none;
    width:100%;
    margin-top:16px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#ffb703,#f48c06);
    color:#161616;
    font-family:inherit;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 5px 18px rgba(255,183,3,.3);
    transition:.2s;
}

.next-btn:hover{
    transform:translateY(-2px);
}

.next-btn.show{
    display:block;
}

/* Result */
.result{
    display:none;
    text-align:center;
    padding:35px 20px;
    background:linear-gradient(145deg,#152451,#0c1530);
    border:2px solid #ffd166;
    border-radius:22px;
    box-shadow:0 0 30px rgba(255,209,102,.25);
}

.result.show{
    display:block;
}

.result h2{
    color:#ffd166;
    font-size:30px;
    margin-bottom:20px;
}

.score-circle{
    width:150px;
    height:150px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#263c76,#111a38);
    border:5px solid #ffd166;
    box-shadow:0 0 25px rgba(255,209,102,.35);
}

.score-number{
    font-size:38px;
    font-weight:800;
    color:#fff;
}

.score-label{
    color:#ffd166;
    font-size:14px;
}

.result-message{
    font-size:18px;
    margin:15px 0 20px;
    line-height:1.8;
}

.restart{
    border:none;
    padding:13px 28px;
    border-radius:12px;
    background:#ffd166;
    color:#111;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:600px){
    body{
        padding:8px;
    }

    .academy{
        font-size:21px;
    }

    .teacher{
        font-size:15px;
    }

    .question{
        font-size:16px;
        line-height:1.75;
        padding:15px;
    }

    .option{
        font-size:15px;
        padding:12px;
    }

    .quiz-card{
        padding:14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="academy">Student Care Academy</div>
        <div class="teacher">Teacher:- Tapan Mandal</div>
    </div>

    <div class="subject">
        Class: 12 | Subject: পুষ্টিবিজ্ঞান (Nutrition) | Semester: III | Full Syllabus
    </div>

    <div class="quiz-card" id="quizCard">

        <div class="progress">
            <span id="questionNo">Question 1</span>
            <span id="scoreText">Score: 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="options" id="options"></div>

        <div class="answer-box" id="answerBox"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
            পরবর্তী প্রশ্ন →
        </button>

    </div>

    <div class="result" id="result">

        <h2>Quiz সম্পূর্ণ হয়েছে!</h2>

        <div class="score-circle">
            <div class="score-number" id="finalScore">0/50</div>
            <div class="score-label">Total Score</div>
        </div>

        <div class="result-message" id="resultMessage"></div>

        <button class="restart" onclick="restartQuiz()">
            আবার Quiz দিন
        </button>

    </div>

</div>

<script>

const questions = [

{
q:"পেশিতে অ্যানেরোবিক শ্বসনে উৎপন্ন ল্যাকটিক অ্যাসিড রক্তে বাহিত হয়ে যকৃতে পুনরায় গ্লুকোজে রূপান্তরিত হয়। এটি কোন চক্রের অংশ?",
options:[
"কোরি চক্র (Cori Cycle)",
"ক্রেবস চক্র",
"অরনিথিন চক্র",
"গ্লাইঅক্সিলেট চক্র"
],
answer:0,
explanation:"পেশি ও যকৃতের মধ্যে গ্লুকোজ ও ল্যাকটিক অ্যাসিডের এই আবর্তনকে বিজ্ঞানী কার্ল কোরি এবং গার্টি কোরি আবিষ্কার করেন।"
},

{
q:"পাইরুভিক অ্যাসিড থেকে অ্যাসিটাইল Co-A তে রূপান্তরিত হওয়ার ধাপে (লিঙ্ক বিক্রিয়া) কোন কো-এনজাইমটি অপরিহার্য?",
options:[
"PLP",
"FAD",
"TPP (Thiamine Pyrophosphate)",
"Biotin"
],
answer:2,
explanation:"পাইরুভেট ডিহাইড্রোজিনেজ কমপ্লেক্স উৎসেচকের কাজ করার জন্য ভিটামিন B1-এর কো-এনজাইম রূপ TPP প্রয়োজন।"
},

{
q:"একজন সুস্থ মানুষের মিশ্র খাদ্যের (Mixed Diet) গড় শ্বসন অনুপাত বা Respiratory Quotient (RQ) কত হয়?",
options:[
"১.০",
"০.৮৫",
"০.৭",
"১.২"
],
answer:1,
explanation:"শর্করার RQ ১.০ এবং ফ্যাটের ০.৭। মিশ্র খাদ্যে উভয়ের সংমিশ্রণ থাকায় গড় মান ০.৮৫ হয়।"
},

{
q:"যকৃতে অরনিথিন চক্র চলাকালীন ইউরিয়া উৎপন্ন হওয়ার ঠিক আগের ধাপে কোন অ্যামাইনো অ্যাসিডটি উপস্থিত থাকে?",
options:[
"সাইট্রুলিন",
"অরনিথিন",
"গ্লুটামিন",
"আর্জিনিন"
],
answer:3,
explanation:"আর্জিনিনেজ উৎসেচকের প্রভাবে আর্জিনিন ভেঙে ইউরিয়া ও অরনিথিন তৈরি করে।"
},

{
q:"পেশি কোষে সঞ্চিত গ্লাইকোজেন ভেঙে গ্লুকোজ-৬-ফসফেট হলেও তা রক্তে গ্লুকোজরূপে মিশতে পারে না, কারণ পেশিতে কোন উৎসেচকটি অনুপস্থিত?",
options:[
"গ্লুকোজ-৬-ফসফাটেজ",
"হেক্সোকাইনেজ",
"ফসফোরাইলেজ",
"অ্যালডোলেজ"
],
answer:0,
explanation:"গ্লুকোজ-৬-ফসফাটেজ মূলত যকৃৎ ও বৃক্কে থাকে, যা গ্লুকোজ-৬-ফসফেট থেকে ফসফেট মূলক সরিয়ে গ্লুকোজ তৈরি করতে পারে।"
},

{
q:"অবাত শ্বসনে বা অ্যানেরোবিক গ্লাইকোলাইসিসে এক অণু গ্লুকোজ থেকে সম্পূর্ণ নিট কতগুলি ATP পাওয়া যায়?",
options:[
"৩৮ ATP",
"৮ ATP",
"২ ATP",
"৩৬ ATP"
],
answer:2,
explanation:"অবাত শ্বসনে গ্লাইকোলাইসিসে ৪টি ATP উৎপন্ন হয় এবং ২টি খরচ হয়, তাই নিট লাভ ২ ATP।"
},

{
q:"খাদ্যের ফ্যাট অন্ত্রে শোষিত হওয়ার পর লসিকা বাহে (Lacteal) প্রবেশের পূর্বে কোন লিপোপ্রোটিন গঠন করে?",
options:[
"VLDL",
"HDL",
"LDL",
"কাইলোমাইক্রন"
],
answer:3,
explanation:"অন্ত্রের কোষ বা এন্টেরোসাইট ট্রাইগ্লিসারাইডকে প্রোটিন দিয়ে মুড়ে কাইলোমাইক্রন তৈরি করে।"
},

{
q:"কোন ভিটামিনের অভাবে ডার্মাটাইটিস, ডায়রিয়া এবং ডিমেনশিয়া—এই '3D' লক্ষণযুক্ত পেলাগ্রা রোগ হয়?",
options:[
"থায়ামিন",
"নিয়াসিন (ভিটামিন B3)",
"রাইবোফ্লাভিন",
"ফলিক অ্যাসিড"
],
answer:1,
explanation:"নিয়াসিনের অভাবে পেলাগ্রা হয়। নিয়াসিনকে Pellagra Preventive Factor (PPF) বলা হয়।"
},

{
q:"ভারতের খাদ্যের নিরাপত্তা ও মান নির্ধারণকারী সর্বোচ্চ সংস্থা 'FSSAI' আইনটি কত সালে প্রণীত হয়?",
options:[
"২০০৬",
"১৯৫৪",
"২০১২",
"১৯৯৫"
],
answer:0,
explanation:"Food Safety and Standards Act, 2006 অনুযায়ী FSSAI গঠিত হয়।"
},

{
q:"হলুদের গুঁড়োয় ক্ষতিকারক কৃত্রিম রং 'মেটানিল ইয়েলো' মেশানো আছে কি না, তা পরীক্ষা করতে কোন রাসায়নিক বিকারকটি ব্যবহৃত হয়?",
options:[
"নাইট্রিক অ্যাসিড (HNO3)",
"হাইড্রোক্লোরিক অ্যাসিড (HCl)",
"আয়োডিন দ্রবণ",
"বেনেডিক্ট দ্রবণ"
],
answer:1,
explanation:"ভেজাল হলুদের গুঁড়োতে কয়েক ফোঁটা গাঢ় HCl দিলে রং পরিবর্তিত হয়ে ম্যাজেন্টা বা গোলাপি হতে পারে।"
},

{
q:"মানব কোষে ফ্যাটি অ্যাসিডের বিটা-অক্সিডেশন (Beta-oxidation) প্রক্রিয়াটি প্রধানত কোষের কোন অংশে সম্পন্ন হয়?",
options:[
"সাইটোপ্লাজম",
"নিউক্লিয়াস",
"মাইটোকনড্রিয়া",
"এন্ডোপ্লাজমিক রেটিকুলাম"
],
answer:2,
explanation:"ফ্যাটি অ্যাসিড কার্নিটিন শাটলের মাধ্যমে মাইটোকনড্রিয়ার ম্যাট্রিক্সে প্রবেশ করে জারিত হয়।"
},

{
q:"ডিওডিনামে অম্লীয় কাইম প্রবেশ করার পর, অগ্ন্যাশয় রস ক্ষরণকে উদ্দীপিত করতে ক্ষুদ্রান্ত্রের মিউকোসা থেকে কোন হরমোনটি নির্গত হয়?",
options:[
"গ্যাস্ট্রিন",
"সোমাটোস্ট্যাটিন",
"ইনসুলিন",
"কোলেসিস্টোকাইনিন (CCK)"
],
answer:3,
explanation:"CCK অগ্ন্যাশয়কে পাচক উৎসেচক ক্ষরণে এবং পিত্তাশয়কে পিত্ত নির্গমনে উদ্দীপ্ত করে।"
},

{
q:"ইনভার্ট সুগার (Invert Sugar) মূলত কোন দুটি শর্করার সমপরিমাণ মিশ্রণ?",
options:[
"গ্লুকোজ ও ফ্রুক্টোজ",
"গ্লুকোজ ও গ্যালাকটোজ",
"ফ্রুক্টোজ ও গ্যালাকটোজ",
"দুটি গ্লুকোজ অণু"
],
answer:0,
explanation:"সুক্রোজকে অম্ল বা ইনভার্টেজ উৎসেচক দিয়ে আর্দ্রবিশ্লেষণ করলে সমপরিমাণ গ্লুকোজ ও ফ্রুক্টোজ তৈরি হয়।"
},

{
q:"প্রোস্টাগ্ল্যান্ডিন (Prostaglandins) হরমোন সংশ্লেষের জন্য মানবদেহে কোন অত্যাবশ্যকীয় ফ্যাটি অ্যাসিডটি প্রিকার্সর (Precursor) হিসেবে কাজ করে?",
options:[
"ওলেইক অ্যাসিড",
"লিনোলিক অ্যাসিড",
"স্টিয়ারিক অ্যাসিড",
"অ্যারাকিডোনিক অ্যাসিড"

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const answerBox = document.getElementById("answerBox");
const nextBtn = document.getElementById("nextBtn");
const questionNo = document.getElementById("questionNo");
const scoreText = document.getElementById("scoreText");
const progressFill = document.getElementById("progressFill");
const quizCard = document.getElementById("quizCard");
const result = document.getElementById("result");
const finalScore = document.getElementById("finalScore");
const resultMessage = document.getElementById("resultMessage");

function loadQuestion(){

    answered = false;

    const q = questions[currentQuestion];

    questionNo.textContent =
        "Question " + (currentQuestion + 1);

    scoreText.textContent =
        "Score: " + score;

    progressFill.style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    questionEl.innerHTML =
        "<strong>" + (currentQuestion + 1) + ".</strong> " + q.q;

    optionsEl.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn = document.createElement("button");

        btn.className = "option";

        btn.innerHTML =
            String.fromCharCode(65 + index) +
            ") " + option;

        btn.onclick = () =>
            selectAnswer(index,btn);

        optionsEl.appendChild(btn);
    });

    answerBox.className = "answer-box";
    answerBox.innerHTML = "";

    nextBtn.className = "next-btn";

    if(currentQuestion === questions.length - 1){
        nextBtn.textContent = "ফলাফল দেখুন →";
    }else{
        nextBtn.textContent = "পরবর্তী প্রশ্ন →";
    }
}

function selectAnswer(selected,selectedButton){

    if(answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const allButtons =
        document.querySelectorAll(".option");

    allButtons.forEach(btn=>{
        btn.disabled = true;
    });

    if(selected === q.answer){

        score++;

        selectedButton.classList.add("correct");

        answerBox.className =
            "answer-box show correct-msg";

        answerBox.innerHTML =
            "<strong>✓ সঠিক উত্তর!</strong><br>" +
            "উত্তর: " +
            q.options[q.answer] +
            "<br><br>" +
            "<strong>ব্যাখ্যা:</strong> " +
            q.explanation;

    }else{

        selectedButton.classList.add("wrong");

        allButtons[q.answer].classList.add("correct");

        answerBox.className =
            "answer-box show wrong-msg";

        answerBox.innerHTML =
            "<strong>✗ ভুল উত্তর!</strong><br>" +
            "সঠিক উত্তর: " +
            q.options[q.answer] +
            "<br><br>" +
            "<strong>ব্যাখ্যা:</strong> " +
            q.explanation;
    }

    scoreText.textContent =
        "Score: " + score;

    nextBtn.className =
        "next-btn show";
}

function nextQuestion(){

    if(!answered) return;

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        showResult();
    }
}

function showResult(){

    quizCard.style.display = "none";

    result.className = "result show";

    finalScore.textContent =
        score + "/" + questions.length;

    const percentage =
        (score / questions.length) * 100;

    if(percentage >= 90){

        resultMessage.innerHTML =
            "🏆 অসাধারণ! আপনার প্রস্তুতি খুবই ভালো।<br>" +
            "আপনি " + percentage.toFixed(0) +
            "% নম্বর পেয়েছেন।";

    }else if(percentage >= 70){

        resultMessage.innerHTML =
            "🎉 খুব ভালো! আরও একটু অনুশীলন করলে আরও ভালো ফল হবে।<br>" +
            "আপনি " + percentage.toFixed(0) +
            "% নম্বর পেয়েছেন।";

    }else if(percentage >= 50){

        resultMessage.innerHTML =
            "👍 ভালো চেষ্টা! গুরুত্বপূর্ণ অধ্যায়গুলো আরও একবার অনুশীলন করুন।<br>" +
            "আপনি " + percentage.toFixed(0) +
            "% নম্বর পেয়েছেন।";

    }else{

        resultMessage.innerHTML =
            "📚 আরও অনুশীলন প্রয়োজন। আবার Quiz দিয়ে নিজেকে যাচাই করুন।<br>" +
            "আপনি " + percentage.toFixed(0) +
            "% নম্বর পেয়েছেন।";
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function restartQuiz(){

    currentQuestion = 0;
    score = 0;
    answered = false;

    result.className = "result";

    quizCard.style.display = "block";

    loadQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

loadQuestion();

</script>
