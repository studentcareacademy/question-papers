<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Care Academy - জৈব রসায়ন Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b2845 0,#08101f 55%,#040812 100%);font-family:'Noto Sans Bengali',sans-serif;color:#fff}
.app{max-width:900px;margin:auto;min-height:100vh;padding:20px}
.brand{text-align:center;margin:8px 0 18px;position:relative}
.brand h1{margin:0;font-size:clamp(22px,5vw,38px);font-weight:900;letter-spacing:.3px;background:linear-gradient(90deg,#ffd54a,#fff,#ffd54a);-webkit-background-clip:text;color:transparent;animation:shine 2.5s linear infinite}
.brand p{margin:5px 0 0;font-size:16px;font-weight:700;color:#dbe7ff}
@keyframes shine{0%{filter:brightness(.9)}50%{filter:brightness(1.5)}100%{filter:brightness(.9)}}
.card{background:rgba(10,19,39,.94);border:1px solid rgba(255,213,74,.35);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:28px}
#welcome{display:block}
#welcome h2{font-size:28px;text-align:center;margin:4px 0 10px;color:#ffd54a}
#welcome .welcome-text{text-align:center;font-size:20px;font-weight:700;line-height:1.7;margin-bottom:24px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;padding:15px 16px;border-radius:13px;border:2px solid #33466f;background:#111d35;color:#fff;font-size:17px;font-family:inherit;outline:none}
input:focus{border-color:#ffd54a}
button{font-family:inherit;cursor:pointer;border:0}
.primary{width:100%;margin-top:18px;padding:15px;border-radius:14px;background:linear-gradient(90deg,#e5a900,#ffd54a);color:#111;font-size:18px;font-weight:900;box-shadow:0 8px 25px rgba(255,213,74,.2)}
.primary:active{transform:scale(.99)}
#quiz{display:none}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.badge{padding:8px 12px;border-radius:20px;background:#172745;color:#ffd54a;font-weight:800}
.progress{height:8px;background:#182642;border-radius:20px;overflow:hidden;margin-bottom:25px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#ff9f43);transition:width .3s}
.question{font-size:clamp(21px,4vw,29px);font-weight:800;line-height:1.55;margin-bottom:24px}
.options{display:grid;gap:12px}
.option{text-align:left;width:100%;padding:16px;border-radius:14px;background:#14223d;color:#fff;border:2px solid #293b61;font-size:18px;font-weight:700;line-height:1.45;transition:.18s}
.option:hover{border-color:#ffd54a;transform:translateY(-1px)}
.option.correct{background:#124b32;border-color:#39d98a}
.option.wrong{background:#54202a;border-color:#ff6b6b}
.option.disabled{cursor:default}
.explain{display:none;margin-top:18px;padding:15px 17px;border-left:4px solid #ffd54a;background:#121f37;border-radius:10px;line-height:1.7;color:#e8efff}
.next{display:none;margin-top:18px;padding:14px 22px;border-radius:12px;background:#ffd54a;color:#111;font-weight:900;font-size:17px}
#result{display:none;text-align:center}
.result-icon{font-size:58px}
.result-title{font-size:30px;font-weight:900;color:#ffd54a}
.score{font-size:54px;font-weight:900;margin:10px 0}
.score span{font-size:22px;color:#dbe7ff}
.result-info{font-size:18px;line-height:1.8}
.review{margin-top:20px;text-align:left;max-height:360px;overflow:auto}
.review-item{padding:12px;border-bottom:1px solid #293b61;line-height:1.6}
.review-item b{color:#ffd54a}
.restart{margin-top:20px;padding:14px 26px;border-radius:12px;background:#ffd54a;color:#111;font-size:17px;font-weight:900}
.small{font-size:13px;color:#9fb0ce;margin-top:12px;text-align:center}
@media(max-width:600px){.app{padding:12px}.card{padding:20px;border-radius:19px}.question{font-size:21px}.option{font-size:16px;padding:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>Student Care Academy</h1>
    <p>Teacher:- Tapan Mandal</p>
  </div>

  <section id="welcome" class="card">
    <h2>স্বাগতম</h2>
    <div class="welcome-text">Student Care Academy এর সব ছাত্র ছাত্রীদের স্বাগতম</div>
    <label for="studentName">ছাত্র / ছাত্রীর নাম লিখুন</label>
    <input id="studentName" type="text" placeholder="আপনার নাম লিখুন..." autocomplete="off">
    <button class="primary" onclick="startQuiz()">কুইজ শুরু করুন</button>
    <div class="small">অধ্যায়: জৈব রসায়ন · মোট প্রশ্ন: 50 · Timer নেই</div>
  </section>

  <section id="quiz" class="card">
    <div class="quiz-top">
      <div class="badge" id="qCount">প্রশ্ন 1 / 50</div>
      <div class="badge" id="liveScore">Score: 0</div>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next" id="nextBtn" onclick="nextQuestion()">পরের প্রশ্ন →</button>
  </section>

  <section id="result" class="card">
    <div class="result-icon">🏆</div>
    <div class="result-title">কুইজ সম্পূর্ণ!</div>
    <div class="score"><span id="finalScore">0</span> / 50</div>
    <div class="result-info" id="resultInfo"></div>
    <div class="review" id="review"></div>
    <button class="restart" onclick="restartQuiz()">আবার কুইজ খেলুন</button>
  </section>
</div>

<script>

let current=0, score=0, answered=false, studentName='';
let playCount = Number(localStorage.getItem('scaOrganicQuizPlays') || 0);

function startQuiz(){
  studentName=document.getElementById('studentName').value.trim();
  if(!studentName){alert('দয়া করে আপনার নাম লিখুন।');return;}
  playCount++;
  localStorage.setItem('scaOrganicQuizPlays', playCount);
  current=0; score=0; answered=false;
  document.getElementById('welcome').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQuestion();
}
function renderQuestion(){
  const q=questions[current];
  answered=false;
  document.getElementById('qCount').textContent='প্রশ্ন '+(current+1)+' / '+questions.length;
  document.getElementById('liveScore').textContent='Score: '+score;
  document.getElementById('progressBar').style.width=((current)/questions.length*100)+'%';
  document.getElementById('question').textContent=q[0];
  const box=document.getElementById('options'); box.innerHTML='';
  q[1].forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.innerHTML='<b>('+String.fromCharCode(97+i)+')</b> '+opt;
    b.onclick=()=>selectAnswer(i,b);
    box.appendChild(b);
  });
  document.getElementById('explain').style.display='none';
  document.getElementById('nextBtn').style.display='none';
}
function selectAnswer(index,button){
  if(answered)return;
  answered=true;
  const q=questions[current];
  document.querySelectorAll('.option').forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===q[2]) b.classList.add('correct');
  });
  if(index===q[2]){score++;button.classList.add('correct');}
  else button.classList.add('wrong');
  document.getElementById('liveScore').textContent='Score: '+score;
  const ex=document.getElementById('explain');
  ex.innerHTML='<b>ব্যাখ্যা:</b> '+q[3];
  ex.style.display='block';
  document.getElementById('nextBtn').textContent=current===questions.length-1?'ফলাফল দেখুন':'পরের প্রশ্ন →';
  document.getElementById('nextBtn').style.display='inline-block';
}
function nextQuestion(){
  if(!answered)return;
  if(current<questions.length-1){current++;renderQuestion();}
  else showResult();
}
function showResult(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('finalScore').textContent=score;
  document.getElementById('resultInfo').innerHTML='<b>'+escapeHtml(studentName)+'</b>, আপনার কুইজ শেষ হয়েছে।<br>এই কুইজটি আপনি মোট <b>'+playCount+'</b> বার খেলেছেন। (Score-এর পাশে মোট খেলার সংখ্যা)';
  const review=document.getElementById('review');
  review.innerHTML='<b>ভুল/সঠিক উত্তর পর্যালোচনা:</b>';
  questions.forEach((q,i)=>{
    const div=document.createElement('div');div.className='review-item';
    div.innerHTML='<b>প্রশ্ন '+(i+1)+':</b> '+q[0]+'<br>সঠিক উত্তর: <b>'+q[1][q[2]]+'</b>';
    review.appendChild(div);
  });
}
function restartQuiz(){
  document.getElementById('result').style.display='none';
  document.getElementById('welcome').style.display='block';
  document.getElementById('studentName').value='';
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
</script>
