<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Student Care Academy - Class 12 Biology Quiz</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Noto Sans Bengali',sans-serif;
    background:
      radial-gradient(circle at top left,#172554 0,#07111f 35%,#020617 100%);
    color:#fff;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:14px;
}

/* HEADER */
.header{
    position:relative;
    overflow:hidden;
    text-align:center;
    padding:20px 12px 18px;
    border-radius:22px;
    background:linear-gradient(135deg,#0f172a,#172554,#1e1b4b);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 15px 45px rgba(0,0,0,.35);
    margin-bottom:15px;
}

.header:before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:#38bdf8;
    filter:blur(90px);
    opacity:.18;
    top:-90px;
    left:-50px;
}

.header:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:#a855f7;
    filter:blur(90px);
    opacity:.18;
    bottom:-100px;
    right:-50px;
}

.brand{
    position:relative;
    z-index:2;
    font-size:25px;
    font-weight:800;
    background:linear-gradient(90deg,#67e8f9,#f0abfc,#fde68a,#67e8f9);
    background-size:300% auto;
    -webkit-background-clip:text;
    color:transparent;
    animation:brandMove 5s linear infinite;
}

@keyframes brandMove{
    0%{background-position:0%}
    100%{background-position:300%}
}

.teacher{
    position:relative;
    z-index:2;
    margin-top:5px;
    font-size:15px;
    font-weight:600;
    color:#dbeafe;
}

.className{
    position:relative;
    z-index:2;
    margin-top:9px;
    font-size:18px;
    font-weight:700;
    color:#fef3c7;
}

.progressArea{
    margin:12px 2px;
}

.progressText{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#cbd5e1;
    margin-bottom:6px;
}

.progress{
    height:8px;
    border-radius:20px;
    background:#1e293b;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    border-radius:20px;
    background:linear-gradient(90deg,#22d3ee,#818cf8,#f472b6);
    transition:.35s;
}

/* QUIZ CARD */
.quizCard{
    background:rgba(15,23,42,.92);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.sectionBadge{
    display:inline-block;
    padding:6px 13px;
    border-radius:30px;
    background:linear-gradient(135deg,#312e81,#7c3aed);
    color:#fff;
    font-size:12px;
    font-weight:700;
    margin-bottom:12px;
}

.questionNo{
    color:#67e8f9;
    font-size:15px;
    font-weight:800;
    margin-bottom:8px;
}

.question{
    font-size:19px;
    line-height:1.75;
    font-weight:700;
    color:#f8fafc;
    margin-bottom:17px;
}

/* OPTIONS */
.options{
    display:grid;
    gap:11px;
}

.option{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid #334155;
    background:linear-gradient(135deg,#111827,#172033);
    cursor:pointer;
    transition:.2s;
    font-size:15px;
    line-height:1.6;
}

.option:hover{
    transform:translateY(-2px);
    border-color:#38bdf8;
    background:#172554;
}

.option input{
    display:none;
}

.optionLetter{
    flex:0 0 30px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#1e293b;
    color:#bae6fd;
    font-weight:800;
}

.option.selected{
    border-color:#22d3ee;
    background:linear-gradient(135deg,#164e63,#172554);
    box-shadow:0 0 18px rgba(34,211,238,.15);
}

.option.selected .optionLetter{
    background:#06b6d4;
    color:#082f49;
}

.option.correct{
    border-color:#22c55e;
    background:rgba(20,83,45,.65);
}

.option.correct .optionLetter{
    background:#22c55e;
    color:#052e16;
}

.option.wrong{
    border-color:#ef4444;
    background:rgba(127,29,29,.55);
}

.option.wrong .optionLetter{
    background:#ef4444;
    color:#450a0a;
}

/* MATCHING */
.matchGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:12px 0 18px;
}

.matchBox{
    border:1px solid #475569;
    border-radius:14px;
    overflow:hidden;
    background:#0f172a;
}

.matchTitle{
    background:linear-gradient(135deg,#312e81,#4338ca);
    padding:9px;
    text-align:center;
    font-weight:800;
    color:#e0e7ff;
}

.matchRow{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:9px 11px;
    border-top:1px solid #334155;
    font-size:14px;
}

.matchLeft{
    color:#bae6fd;
    font-weight:700;
}

.matchRight{
    color:#fde68a;
    text-align:right;
}

@media(max-width:600px){
    .matchGrid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .matchRow{
        font-size:12px;
        padding:8px;
    }
}

/* ASSERTION */
.assertionBox{
    background:#111827;
    border:1px solid #475569;
    border-radius:15px;
    padding:14px;
    margin-bottom:15px;
}

.assertion{
    padding:9px;
    border-radius:10px;
    background:#172554;
    margin-bottom:8px;
    line-height:1.65;
}

.reason{
    padding:9px;
    border-radius:10px;
    background:#3f1d4e;
    line-height:1.65;
}

/* BUTTON */
.btnRow{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:20px;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.nextBtn{
    flex:1;
    padding:13px 18px;
    border-radius:14px;
    background:linear-gradient(135deg,#06b6d4,#4f46e5);
    color:#fff;
    font-size:16px;
    font-weight:800;
    box-shadow:0 8px 25px rgba(79,70,229,.3);
}

.nextBtn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.nextBtn:not(:disabled):active{
    transform:scale(.98);
}

/* RESULT */
.result{
    display:none;
    text-align:center;
}

.resultIcon{
    width:90px;
    height:90px;
    margin:8px auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#06b6d4);
    font-size:43px;
    box-shadow:0 0 35px rgba(34,197,94,.25);
}

.resultTitle{
    font-size:27px;
    font-weight:800;
    color:#fef3c7;
}

.scoreBox{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0;
}

.scoreItem{
    background:#111827;
    border:1px solid #334155;
    border-radius:16px;
    padding:15px;
}

.scoreLabel{
    color:#94a3b8;
    font-size:13px;
}

.scoreValue{
    margin-top:5px;
    font-size:29px;
    font-weight:800;
    color:#67e8f9;
}

.restart{
    width:100%;
    padding:14px;
    border-radius:15px;
    background:linear-gradient(135deg,#7c3aed,#db2777);
    color:#fff;
    font-weight:800;
    font-size:16px;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:11px;
    padding:18px 0 5px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="brand">Student Care Academy</div>
    <div class="teacher">Teacher:- Tapan Mandal</div>
    <div class="className">Class-12 Semester-3 Biology</div>
</header>

<div class="progressArea" id="progressArea">
    <div class="progressText">
        <span id="sectionText">General MCQs</span>
        <span><span id="currentNo">1</span> / <span id="totalNo">50</span></span>
    </div>
    <div class="progress">
        <div class="progressBar" id="progressBar"></div>
    </div>
</div>

<div class="quizCard">

<div id="quiz"></div>

<div class="result" id="result">

    <div class="resultIcon">✓</div>

    <div class="resultTitle">Exam Completed!</div>

    <div class="scoreBox">

        <div class="scoreItem">
            <div class="scoreLabel">Total Score</div>
            <div class="scoreValue" id="finalScore">0</div>
        </div>

        <div class="scoreItem">
            <div class="scoreLabel">Attempt Number</div>
            <div class="scoreValue" id="attemptNo">1</div>
        </div>

        <div class="scoreItem">
            <div class="scoreLabel">Correct</div>
            <div class="scoreValue" id="correctNo">0</div>
        </div>

        <div class="scoreItem">
            <div class="scoreLabel">Wrong</div>
            <div class="scoreValue" id="wrongNo">0</div>
        </div>

    </div>

    <button class="restart" onclick="restartQuiz()"> আবার পরীক্ষা দিন </button>

</div>

</div>

<div class="footer">
    Student Care Academy • Class-12 Semester-3 Biology
</div>

</div>

<script>

/* =========================================================
   QUESTION BANK

const questions = [

o:["সেলুলোজ","লিগনোসেলুলোজ","কাইটিন","স্পোরোপোলেনিন"],

/* =========================================================
   QUIZ ENGINE
========================================================= */

let current=0;
let score=0;
let answered=false;

const quiz=document.getElementById("quiz");
const result=document.getElementById("result");
const progressArea=document.getElementById("progressArea");
const currentNo=document.getElementById("currentNo");
const totalNo=document.getElementById("totalNo");
const progressBar=document.getElementById("progressBar");
const sectionText=document.getElementById("sectionText");

totalNo.textContent=questions.length;

function renderQuestion(){

    answered=false;

    const item=questions[current];

    currentNo.textContent=current+1;
    sectionText.textContent=item.section;

    progressBar.style.width=((current)/questions.length*100)+"%";

    let html=`
        <div class="sectionBadge">${item.section}</div>

        <div class="questionNo">
            Question ${current+1}
        </div>
    `;

    if(item.type==="matching"){

        html+=`
        <div class="question">${item.q}</div>

        <div class="matchGrid">
            <div class="matchBox">
                <div class="matchTitle">Statements</div>
        `;

        item.match.forEach(x=>{
            html+=`
                <div class="matchRow">
                    <span class="matchLeft">${x[0]}</span>
                </div>
            `;
        });

        html+=`
            </div>

            <div class="matchBox">
                <div class="matchTitle">Matching</div>
        `;

        item.match.forEach(x=>{
            html+=`
                <div class="matchRow">
                    <span class="matchRight">${x[1]}</span>
                </div>
            `;
        });

        html+=`
            </div>
        </div>
        `;

    }else if(item.type==="ar"){

        html+=`
        <div class="assertionBox">

            <div class="assertion">
                <b>বিবৃতি (A):</b><br>
                ${item.q}
            </div>

            <div class="reason">
                <b>কারণ (R):</b><br>
                ${item.r}
            </div>

        </div>
        `;

    }else{

        html+=`
        <div class="question">${item.q}</div>
        `;

    }

    html+=`<div class="options">`;

    item.o.forEach((option,index)=>{

        const letter=String.fromCharCode(65+index);

        html+=`
        <label class="option" data-index="${index}">

            <input type="radio" name="answer" value="${index}">

            <span class="optionLetter">${letter}</span>

            <span>${option}</span>

        </label>
        `;

    });

    html+=`</div>`;

    html+=`
        <div class="btnRow">
            <button class="nextBtn" id="nextBtn" disabled>
                ${current===questions.length-1 ? "Finish Exam" : "Next Question"}
            </button>
        </div>
    `;

    quiz.innerHTML=html;

    document.querySelectorAll(".option").forEach(option=>{

        option.addEventListener("click",function(){

            if(answered)return;

            document.querySelectorAll(".option")
                .forEach(x=>x.classList.remove("selected"));

            this.classList.add("selected");

            const input=this.querySelector("input");
            input.checked=true;

            document.getElementById("nextBtn").disabled=false;

        });

    });

    document.getElementById("nextBtn").addEventListener("click",checkAnswer);
}

function checkAnswer(){

    if(answered)return;

    const selected=document.querySelector('input[name="answer"]:checked');

    if(!selected)return;

    answered=true;

    const selectedIndex=parseInt(selected.value);
    const correctIndex=questions[current].a;

    const options=document.querySelectorAll(".option");

    if(selectedIndex===correctIndex){
        score++;
        options[selectedIndex].classList.add("correct");
    }else{

        options[selectedIndex].classList.add("wrong");
        options[correctIndex].classList.add("correct");

    }

    const btn=document.getElementById("nextBtn");

    btn.disabled=false;

    btn.textContent=current===questions.length-1
        ?"Show Result"
        :"Next Question";

    btn.onclick=()=>{

        if(current===questions.length-1){

            showResult();

        }else{

            current++;
            renderQuestion();

        }

    };

}

function showResult(){

    progressBar.style.width="100%";

    quiz.style.display="none";
    progressArea.style.display="none";
    result.style.display="block";

    const attemptKey="studentCareBiologyAttempts";

    let attempts=parseInt(localStorage.getItem(attemptKey)||"0");

    attempts++;

    localStorage.setItem(attemptKey,attempts);

    document.getElementById("finalScore").textContent=
        score+" / "+questions.length;

    document.getElementById("correctNo").textContent=score;

    document.getElementById("wrongNo").textContent=
        questions.length-score;

    document.getElementById("attemptNo").textContent=attempts;

}

function restartQuiz(){

    current=0;
    score=0;
    answered=false;

    result.style.display="none";
    quiz.style.display="block";
    progressArea.style.display="block";

    renderQuestion();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* START */
renderQuestion();

</script>
