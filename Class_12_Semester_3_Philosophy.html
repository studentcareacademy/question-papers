<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Class 12 Semester 3 Philosophy — Online Mock Test</title>
<style>
:root{--bg:#07111f;--card:#0f1d31;--card2:#142641;--gold:#f5c451;--text:#f5f7fb;--muted:#a9b8cf;--green:#1ec98b;--red:#ff5b6e;--line:#29405f;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#17365d 0,#07111f 46%,#040912 100%);font-family:"Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;color:var(--text);min-height:100vh}
.wrap{max-width:850px;margin:auto;padding:16px}
.header{position:sticky;top:0;z-index:5;background:rgba(7,17,31,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 10px 35px #0006}
.brand{font-size:clamp(20px,5vw,30px);font-weight:900;text-align:center;color:#fff;animation:glow 1.8s infinite alternate}
.teacher{text-align:center;color:var(--gold);font-weight:800;margin-top:4px}
@keyframes glow{from{text-shadow:0 0 4px #fff2,0 0 8px #2d8cff2}to{text-shadow:0 0 8px #fff8,0 0 22px #2d8cff}}
.info{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap}
.badge{border:1px solid var(--line);background:#0b1728;padding:7px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.badge b{color:#fff}
.progress{height:8px;background:#081321;border-radius:99px;overflow:hidden;margin-top:12px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#f5c451,#6be7ff,#57e89b);transition:.35s}
.card{background:linear-gradient(145deg,rgba(20,38,65,.98),rgba(9,20,36,.98));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 18px 55px #0005}
.qno{color:var(--gold);font-weight:900;font-size:14px;margin-bottom:8px}
.question{font-size:clamp(19px,4vw,27px);line-height:1.65;font-weight:800;margin-bottom:18px}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#10213a;border:1px solid #2b4567;color:#fff;border-radius:14px;padding:13px 14px;margin:10px 0;cursor:pointer;font-size:16px;line-height:1.55;transition:.2s}
.option:hover{transform:translateY(-1px);border-color:#6b8db8}
.option .letter{min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1d3555;color:var(--gold);font-weight:900}
.option.selected{border-color:#f5c451;background:#2a2a19}
.option.correct{border-color:var(--green);background:#0d3a2d}
.option.wrong{border-color:var(--red);background:#421d27}
.option.disabled{cursor:default}
.explain{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#091626;border:1px dashed #38587f;color:var(--muted);line-height:1.55}
.actions{display:flex;justify-content:flex-end;margin-top:18px}
button{border:0;border-radius:13px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer}
#nextBtn{background:linear-gradient(135deg,#f5c451,#ffdc78);color:#101010;display:none}
#nextBtn:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;text-align:center;padding:28px 18px}
.score{font-size:clamp(48px,14vw,84px);font-weight:1000;color:var(--gold);line-height:1}
.result h2{font-size:28px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:#0a1728;border:1px solid var(--line);border-radius:15px;padding:14px}
.stat b{display:block;font-size:24px;color:#fff}
.stat span{font-size:12px;color:var(--muted)}
.restart{background:#1e75ff;color:white;margin:5px}
@media(max-width:600px){.wrap{padding:9px}.card{padding:15px;border-radius:17px}.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:10px 5px}}
</style>
</head>
<body>
<div class="wrap">
<header class="header">
  <div class="brand">Student Care Academy</div>
  <div class="teacher">Teacher:- Tapan Mandal</div>
  <div class="info">
    <div class="badge">Class 12 • Semester 3 • Philosophy</div>
    <div class="badge">Question <b id="counter">1 / 50</b></div>
    <div class="badge">Score <b id="liveScore">0</b> • Exam <b id="attemptTop">1</b></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</header>

<main class="card" id="quizCard">
  <div class="qno" id="qno"></div>
  <div class="question" id="question"></div>
  <div id="options"></div>
  <div class="explain" id="explain"></div>
  <div class="actions"><button id="nextBtn">পরের প্রশ্ন →</button></div>
</main>

<section class="card result" id="result">
  <div>পরীক্ষা সম্পূর্ণ</div>
  <div class="score" id="finalScore">0/50</div>
  <h2 id="message">অভিনন্দন!</h2>
  <div class="stats">
    <div class="stat"><b id="rightCount">0</b><span>সঠিক</span></div>
    <div class="stat"><b id="wrongCount">0</b><span>ভুল</span></div>
    <div class="stat"><b id="attemptCount">1</b><span>Exam Attempt</span></div>
  </div>
  <button class="restart" onclick="restart()">আবার পরীক্ষা দিন</button>
</section>
</div>

<script>

  const exp=document.getElementById("explain");
  exp.innerHTML=correct ? "✓ সঠিক উত্তর" : "✗ সঠিক উত্তর: <b>"+item.a.map(i=>letters[i]).join(" / ")+"</b>";
  exp.style.display="block";
  document.getElementById("nextBtn").style.display="inline-block";
}

document.getElementById("nextBtn").onclick=()=>{
  if(!answered) return;
  index++;
  if(index<QUESTIONS.length) render();
  else finish();
};

function finish(){
  document.getElementById("quizCard").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("bar").style.width="100%";
  document.getElementById("counter").textContent=QUESTIONS.length+" / "+QUESTIONS.length;
  document.getElementById("finalScore").textContent=score+" / "+QUESTIONS.length;
  document.getElementById("rightCount").textContent=score;
  document.getElementById("wrongCount").textContent=QUESTIONS.length-score;
  document.getElementById("attemptCount").textContent=attempts;
  const pct=score/QUESTIONS.length*100;
  document.getElementById("message").textContent=pct>=80?"দারুণ! প্রস্তুতি খুব ভালো।":pct>=50?"ভালো হয়েছে—আরও একবার রিভিশন করুন।":"আরও একটু অনুশীলন করুন। আবার পরীক্ষা দিন।";
}

function restart(){
  index=0; score=0;
  document.getElementById("quizCard").style.display="block";
  document.getElementById("result").style.display="none";
  attempts++;
  localStorage.setItem(key,String(attempts));
  document.getElementById("attemptTop").textContent=attempts;
  render();
}
render();
</script>
</body>
</html>
