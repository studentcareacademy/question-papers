<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Care Academy - বাংলা Quiz</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    "Noto Sans Bengali",
    "Nirmala UI",
    "SolaimanLipi",
    Arial,
    sans-serif;

    background:
    radial-gradient(circle at top,#18213b 0%,#080b16 45%,#03050b 100%);

    min-height:100vh;
    color:white;
    padding:15px;
}

/* ================= HEADER ================= */

.header{
    max-width:900px;
    margin:auto;
    text-align:center;
    padding:18px 10px 22px;
}

.academy{
    font-size:27px;
    font-weight:900;
    letter-spacing:1px;

    background:linear-gradient(
        90deg,
        #ffd700,
        #ffffff,
        #ffd700,
        #ffae00,
        #ffffff,
        #ffd700
    );

    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:
        shine 4s linear infinite,
        floating 2.5s ease-in-out infinite;
}

.teacher{
    margin-top:7px;
    font-size:18px;
    font-weight:bold;
    color:#fff;

    animation:pulseText 2s infinite;
}

@keyframes shine{
    0%{background-position:0% center;}
    100%{background-position:300% center;}
}

@keyframes floating{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
}

@keyframes pulseText{
    0%,100%{opacity:.75;}
    50%{opacity:1;}
}

/* ================= TITLE ================= */

.title{
    max-width:900px;
    margin:0 auto 15px;
    text-align:center;
}

.title h1{
    font-size:23px;
    color:#ffd700;
    margin-bottom:5px;
}

.title p{
    color:#d8d8d8;
    font-size:14px;
}

/* ================= QUIZ CARD ================= */

.quiz-container{
    max-width:900px;
    margin:auto;
}

.quiz-card{
    background:
    linear-gradient(
        145deg,
        rgba(28,37,68,.98),
        rgba(7,11,25,.98)
    );

    border:2px solid #8e7015;
    border-radius:22px;

    padding:22px;

    box-shadow:
    0 0 25px rgba(255,215,0,.12),
    inset 0 0 25px rgba(255,255,255,.025);

    min-height:450px;
}

/* ================= QUESTION ================= */

.question{
    text-align:center;
    font-size:21px;
    line-height:1.75;
    font-weight:700;

    background:
    linear-gradient(
        135deg,
        rgba(255,215,0,.08),
        rgba(255,255,255,.03)
    );

    border:1px solid rgba(255,215,0,.35);

    border-radius:15px;

    padding:20px 16px;
    margin-bottom:20px;
}

/* ================= OPTIONS ================= */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.option{
    position:relative;

    min-height:62px;

    border:1px solid #555f7d;
    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #161d34,
        #0d1222
    );

    color:white;

    padding:13px 16px;

    font-size:17px;
    text-align:left;

    cursor:pointer;

    transition:
    transform .2s,
    border .2s,
    background .2s,
    box-shadow .2s;
}

.option:hover{
    transform:translateY(-2px);

    border-color:#ffd700;

    box-shadow:
    0 0 15px rgba(255,215,0,.2);
}

.option.selected{
    border-color:#ffd700;
}

.option.correct{
    background:
    linear-gradient(
        135deg,
        #08783c,
        #064b29
    );

    border-color:#37ff93;

    box-shadow:
    0 0 18px rgba(55,255,147,.3);
}

.option.wrong{
    background:
    linear-gradient(
        135deg,
        #8d1720,
        #500b11
    );

    border-color:#ff5964;

    box-shadow:
    0 0 18px rgba(255,70,80,.25);
}

.option.disabled{
    cursor:default;
}

.option.disabled:hover{
    transform:none;
}

/* ================= FEEDBACK ================= */

.feedback{
    margin-top:17px;

    text-align:center;

    font-size:18px;
    font-weight:bold;

    min-height:30px;
}

.feedback.correct-text{
    color:#42ff98;
}

.feedback.wrong-text{
    color:#ff6873;
}

/* ================= NEXT BUTTON ================= */

.next-btn{
    display:block;

    margin:20px auto 0;

    padding:13px 35px;

    border:none;
    border-radius:30px;

    background:
    linear-gradient(
        90deg,
        #b8860b,
        #ffd700,
        #b8860b
    );

    color:#111;

    font-size:17px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 4px 15px rgba(255,215,0,.25);

    transition:.2s;
}

.next-btn:hover{
    transform:scale(1.05);
}

.next-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* ================= MATCHING BOX ================= */

.matching-box{

    margin-bottom:18px;

    border:2px solid #806714;

    border-radius:15px;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        rgba(255,215,0,.05),
        rgba(255,255,255,.02)
    );
}

.matching-title{
    background:
    linear-gradient(
        90deg,
        #4e3d0b,
        #8b6d12,
        #4e3d0b
    );

    padding:10px;

    text-align:center;

    color:#ffd700;

    font-weight:bold;

    font-size:17px;
}

.matching-table{
    width:100%;
    border-collapse:collapse;
}

.matching-table td{
    padding:11px;
    border:1px solid #404963;
    font-size:16px;
    vertical-align:top;
}

.matching-table td:first-child{
    width:50%;
    color:#fff;
}

.matching-table td:last-child{
    color:#ffd700;
}

/* ================= SPECIAL BOX ================= */

.special-box{

    margin-bottom:17px;

    padding:15px;

    border-radius:14px;

    border:1px solid #53617e;

    background:rgba(255,255,255,.035);

    line-height:1.8;

    font-size:16px;
}

.assertion{
    border-left:5px solid #ffd700;
}

.case-study{
    border-left:5px solid #25d9ff;
}

.case-title{
    color:#25d9ff;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

/* ================= PROGRESS ================= */

.progress-area{
    max-width:900px;
    margin:14px auto;

    display:flex;
    align-items:center;
    gap:10px;
}

.progress-bar{
    flex:1;
    height:8px;

    background:#222a40;

    border-radius:10px;

    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;

    background:
    linear-gradient(
        90deg,
        #b8860b,
        #ffd700
    );

    transition:width .3s;
}

.progress-text{
    font-size:13px;
    color:#ddd;
}

/* ================= RESULT ================= */

.result{
    display:none;

    max-width:700px;

    margin:30px auto;

    text-align:center;

    padding:35px 20px;

    background:
    radial-gradient(
        circle at top,
        #252e50,
        #080b17 70%
    );

    border:2px solid #ffd700;

    border-radius:25px;

    box-shadow:
    0 0 35px rgba(255,215,0,.18);
}

.result h2{
    color:#ffd700;
    font-size:29px;
    margin-bottom:20px;
}

.score-circle{

    width:155px;
    height:155px;

    margin:0 auto 20px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-direction:column;

    border:6px solid #ffd700;

    box-shadow:
    0 0 25px rgba(255,215,0,.25);
}

.score-number{
    font-size:38px;
    font-weight:900;
    color:#ffd700;
}

.score-total{
    color:#ddd;
}

.result-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;

    margin-top:20px;
}

.result-box{
    padding:13px;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    border:1px solid #414b69;
}

.result-box strong{
    display:block;
    color:#ffd700;
    font-size:21px;
}

.restart{
    margin-top:25px;

    padding:13px 30px;

    border:none;

    border-radius:25px;

    background:#ffd700;

    color:#111;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    color:#777;
    font-size:12px;
    margin:25px 0 10px;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

    body{
        padding:9px;
    }

    .academy{
        font-size:22px;
    }

    .teacher{
        font-size:16px;
    }

    .title h1{
        font-size:19px;
    }

    .quiz-card{
        padding:13px;
        border-radius:17px;
    }

    .question{
        font-size:18px;
        padding:15px 10px;
    }

    .options{
        grid-template-columns:1fr;
        gap:10px;
    }

    .option{
        font-size:16px;
        min-height:55px;
    }

    .matching-table td{
        font-size:14px;
        padding:8px;
    }

    .result-info{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="academy">
        Student Care Academy
    </div>

    <div class="teacher">
        Teacher:- Tapan Mandal
    </div>

</header>


<div class="title">

    <h1>বাংলা — ‘বাঙ্গালা ভাষা’ — স্বামী বিবেকানন্দ</h1>

    <p>
        Semester III • Interactive Practice Quiz
    </p>

</div>


<!-- ================= PROGRESS ================= -->

<div class="progress-area">

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="progress-text" id="progressText">
        প্রশ্ন চলছে
    </div>

</div>


<!-- ================= QUIZ ================= -->

<div class="quiz-container">

    <div class="quiz-card" id="quizCard">

        <div id="questionArea"></div>

        <div class="options" id="optionsArea"></div>

        <div id="feedback" class="feedback"></div>

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            disabled>
            পরের প্রশ্ন
        </button>

    </div>

</div>


<!-- ================= RESULT ================= -->

<div class="result" id="result">

    <h2>🎉 Quiz সম্পূর্ণ হয়েছে!</h2>

    <div class="score-circle">

        <div class="score-number" id="finalScore">
            0
        </div>

        <div class="score-total">
            / 50
        </div>

    </div>


    <div class="result-info">

        <div class="result-box">

            <strong id="correctCount">
                0
            </strong>

            সঠিক

        </div>


        <div class="result-box">

            <strong id="wrongCount">
                0
            </strong>

            ভুল

        </div>


        <div class="result-box">

            <strong id="percentage">
                0%
            </strong>

            Percentage

        </div>

    </div>


    <button
        class="restart"
        onclick="restartQuiz()">

        আবার শুরু করুন

    </button>

</div>


<div class="footer">
    Student Care Academy • Academic Practice Quiz
</div>


<script>

/* =====================================================
   QUIZ DATA
===================================================== */

const questions = [

/* ================= সাধারণ MCQ ================= */

/* =====================================================
   QUIZ ENGINE
===================================================== */

let currentQuestion = 0;
let score = 0;
let correct = 0;
let wrong = 0;
let answered = false;


/* ================= LOAD QUESTION ================= */

function loadQuestion(){

    answered = false;

    const data = questions[currentQuestion];

    const questionArea =
        document.getElementById("questionArea");

    const optionsArea =
        document.getElementById("optionsArea");

    const feedback =
        document.getElementById("feedback");

    const nextBtn =
        document.getElementById("nextBtn");


    questionArea.innerHTML = "";
    optionsArea.innerHTML = "";
    feedback.innerHTML = "";

    feedback.className = "feedback";

    nextBtn.disabled = true;


    /* ---------- SPECIAL BOX ---------- */

    if(data.type === "assertion"){

        questionArea.innerHTML = `

        <div class="special-box assertion">

            <strong style="color:#ffd700;">
                বিবৃতি
            </strong>

            <br>

            ${data.q}

            <br><br>

            <strong style="color:#25d9ff;">
                কারণ
            </strong>

            <br>

            ${data.r}

        </div>

        `;

    }

    else if(data.type === "matching"){

        questionArea.innerHTML = `

        <div class="matching-box">

            <div class="matching-title">
                মিল খুঁজে সঠিক বিকল্প নির্বাচন করো
            </div>

            ${data.box}

        </div>

        <div class="question">
            ${data.q}
        </div>

        `;

    }

    else if(data.type === "case"){

        questionArea.innerHTML = `

        <div class="special-box case-study">

            <div class="case-title">
                📘 কেস স্টাডি
            </div>

            ${data.caseText}

        </div>

        <div class="question">
            ${data.q}
        </div>

        `;

    }

    else{

        questionArea.innerHTML = `

        <div class="question">
            ${data.q}
        </div>

        `;

    }


    /* ---------- OPTIONS ---------- */

    data.options.forEach((option,index)=>{

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerHTML = option;

        button.onclick =
            ()=>selectAnswer(index);

        optionsArea.appendChild(button);

    });


    /* ---------- PROGRESS ---------- */

    const percentage =
        ((currentQuestion) / questions.length) * 100;

    document.getElementById(
        "progressFill"
    ).style.width = percentage + "%";

    document.getElementById(
        "progressText"
    ).innerText =
        "পরবর্তী প্রশ্ন";

}


/* ================= SELECT ANSWER ================= */

function selectAnswer(selected){

    if(answered) return;

    answered = true;

    const data = questions[currentQuestion];

    const options =
        document.querySelectorAll(".option");

    options.forEach(
        btn => btn.classList.add("disabled")
    );


    /* Correct */

    options[data.answer]
        .classList.add("correct");


    if(selected === data.answer){

        score++;

        correct++;

        options[selected]
            .classList.add("selected");

        showFeedback(
            "✓ সঠিক উত্তর!",
            true
        );

    }

    else{

        wrong++;

        options[selected]
            .classList.add("wrong");

        showFeedback(
            "✗ ভুল উত্তর!",
            false
        );

    }


    document.getElementById(
        "nextBtn"
    ).disabled = false;

}


/* ================= FEEDBACK ================= */

function showFeedback(text,isCorrect){

    const feedback =
        document.getElementById("feedback");

    feedback.innerHTML = text;

    feedback.className =
        "feedback " +
        (isCorrect
        ? "correct-text"
        : "wrong-text");

}


/* ================= NEXT ================= */

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        showResult();

        return;

    }

    loadQuestion();

}


/* ================= RESULT ================= */

function showResult(){

    document.querySelector(
        ".quiz-container"
    ).style.display = "none";

    document.querySelector(
        ".progress-area"
    ).style.display = "none";


    const result =
        document.getElementById("result");

    result.style.display = "block";


    document.getElementById(
        "finalScore"
    ).innerText = score;


    document.getElementById(
        "correctCount"
    ).innerText = correct;


    document.getElementById(
        "wrongCount"
    ).innerText = wrong;


    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    document.getElementById(
        "percentage"
    ).innerText =
        percentage + "%";

}


/* ================= RESTART ================= */

function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    correct = 0;

    wrong = 0;

    document.querySelector(
        ".quiz-container"
    ).style.display = "block";


    document.querySelector(
        ".progress-area"
    ).style.display = "flex";


    document.getElementById(
        "result"
    ).style.display = "none";


    loadQuestion();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================= START ================= */

loadQuestion();

</script>
