<style>
*{box-sizing:border-box}
body{
  margin:0; font-family:"Noto Sans Bengali","Noto Sans",Arial,sans-serif;

.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}
.brand{

.brand small{display:block;font-size:.55em;color:#e9f4ff}
@keyframes shine{to{background-position:300% center}}

.topline{height:5px;border-radius:10px;background:linear-gradient(90deg,#ffd54a,#fff,#4de4ff);margin:16px 0}
.card{

.section{text-align:center;color:#ffd86b;font-weight:800;letter-spacing:1px;font-size:14px;margin-bottom:12px}
.question{font-size:clamp(20px,4.5vw,29px);font-weight:800;line-height:1.5;margin:8px 0 20px}
.options{display:grid;gap:12px}
.option{
  width:100%;border:1px solid rgba(255,255,255,.18);border-radius:15px;
  background:linear-gradient(90deg,#172c50,#0e1c36);color:#fff;

.option:hover{transform:translateX(4px);border-color:#ffd54a;box-shadow:0 0 18px rgba(255,213,74,.15)}
.option.correct{background:linear-gradient(90deg,#0d633f,#0a3b2b);border-color:#55f0a4}
.option.wrong{background:linear-gradient(90deg,#752b36,#451a23);border-color:#ff7d8c}
.option:disabled{cursor:default;opacity:.98}
.feedback{margin-top:16px;padding:14px;border-radius:14px;display:none;line-height:1.55}
.feedback.good{display:block;background:rgba(37,190,123,.12);border:1px solid rgba(85,240,164,.4)}
.feedback.bad{display:block;background:rgba(255,87,105,.12);border:1px solid rgba(255,125,140,.4)}
.explain{margin-top:7px;color:#d8e5f6}
.next{
  display:none;margin:18px auto 0;border:0;border-radius:14px;
  padding:13px 28px;font-size:17px;font-weight:800;cursor:pointer;
  color:#071226;background:linear-gradient(90deg,#ffd54a,#fff08a);
  box-shadow:0 8px 25px rgba(255,213,74,.2);
}
.progress{height:9px;background:#091426;border-radius:10px;overflow:hidden;margin:5px 0 18px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#6be7ff);transition:.35s}
.status{text-align:center;color:#aac0dc;font-size:13px;margin-bottom:4px}
.start,.result{text-align:center}
.start h2,.result h2{color:#ffd86b}
.start p{line-height:1.7;color:#d6e3f4}
.start button{border:0;border-radius:16px;padding:14px 34px;font-size:18px;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#ffd54a,#fff08a);color:#071226}
#quiz{display:none}
.scoreCircle{

.scoreCircle strong{font-size:38px}.scoreCircle span{font-size:13px;color:#bcd0e8}
.restart{border:0;border-radius:14px;padding:12px 24px;font-weight:800;cursor:pointer;background:#fff;color:#071226}
.note{font-size:12px;color:#8fa6c2;text-align:center;margin-top:14px}
</style>

n", "material wealth"], "a": 0, "e": "The sea represents exploration and adventure."}, {"q": "Ulysses wants his remaining life to be used for —", "o": ["further exploration", "complete retirement", "political campaigning", "agricultural work"], "a": 0, "e": "He wants to use his remaining life for exploration."}, {"q": "The contrast between Ulysses and Telemachus highlights differences in —", "o": ["temperament and duty", "age and appearance only", "wealth and poverty", "education and language"], "a": 0, "e": "Their contrast lies in temperament and duty."}, {"q": "Ulysses' speech is addressed to —", "o": ["his mariners", "his enemies", "a group of merchants", "foreign soldiers"], "a": 0, "e": "Ulysses directly addresses his mariners."}, {"q": "The famous concluding idea of the poem emphasizes the importance of —", "o": ["perseverance", "wealth", "silence", "political power"], "a": 0, "e": "The ending emphasizes perseverance and continued effort."}, {"q": "Ulysses' desire for new knowledge reflects his belief that —", "o": ["knowledge has no final limit", "knowledge is dangerous", "knowledge belongs only to kings", "knowledge should be avoided in old age"], "a": 0, "e": "He sees knowledge as without a final limit."}, {"q": "The poem presents old age as a period when a person may still —", "o": ["strive for meaningful achievement", "stop thinking completely", "reject all experience", "avoid responsibility"], "a": 0, "e": "Old age does not prevent meaningful striving."}, {"q": "Ulysses' character is best understood through his strong desire for —", "o": ["adventure and experience", "wealth and luxury", "domestic comfort", "political domination"], "a": 0, "e": "Adventure and experience dominate his personality."}, {"q": "The dramatic quality of the poem is strengthened by —", "o": ["Ulysses' direct speech", "a dialogue between two kings", "a comic narrator", "a series of letters"], "a": 0, "e": "Direct speech gives the poem dramatic force."}, {"q": "The dominant message omes an advice construction."}, {"q": "Choose the correct form: The boy said, “I have completed my work.”", "o": ["The boy said that he had completed his work.", "The boy said that he has completed my work.", "The boy said that I had completed his work.", "The boy says that he had completed my work."], "a": 0, "e": "Present perfect changes to past perfect in reported speech."}, {"q": "Choose the correct sentence:", "o": ["Neither of the boys is guilty.", "Neither of the boys are guilty.", "Neither boys is guilty.", "Neither of boys are guilty."], "a": 0, "e": "“Neither” takes a singular verb in this construction."}, {"q": "Choose the correct sentence:", "o": ["He is senior to me.", "He is senior than me.", "He is senior from me.", "He is more senior than to me."], "a": 0, "e": "“Senior” takes the preposition “to”."}, {"q": "Choose the correct sentence:", "o": ["Each of the students has a book.", "Each of the students have a book.", "Each students has a book.", "Each of students have books."], "a": 0, "e": "“Each” takes a singular verb."}, {"q": "Choose the correct sentence:", "o": ["No sooner did he arrive than the train left.", "No sooner he arrived than the train left.", "No sooner did he arrived when the train left.", "No sooner he had arrived when the train left."], "a": 0, "e": "The correct correlative structure is “No sooner...than”."}, {"q": "Choose the correct sentence:", "o": ["The news is true.", "The news are true.", "The news were true.", "The news have true."], "a": 0, "e": "“News” is grammatically singular."}, {"q": "Choose the correct sentence:", "o": ["He has been living here for five years.", "He is living here since five years.", "He has living here for five years.", "He was living here since five years."], "a": 0, "e": "“For five years” correctly combines with the present perfect continuous."}, {"q": "The library in Passage–1 was situated beside a —", "o": ["river", "pond", "railway station", "market"], "a": 1, "e": "The passage says the library s const sections = [
  [0,30,"PROSE"],
  [30,60,"VERSE"],
  [60,75,"DRAMA — Riders to the Sea"],
  [75,90,"TEXTUAL GRAMMAR"],
  [90,120,"READING COMPREHENSION — UNSEEN"]
];
let index=0, score=0, answered=false;

function getSection(i){
  for(const s of sections) if(i>=s[0] && i<s[1]) return s[2];
  return "";
}
function startQuiz(){
  document.getElementById('start').style.display='none';
  document.getElementById('quiz').style.display='block';
  index=0; score=0; answered=false;
  render();
}
function render(){
  const item=questions[index];
  answered=false;
  document.getElementById('section').textContent=getSection(index);
  document.getElementById('status').textContent='প্রশ্ন '+(index+1)+' / '+questions.length;
  document.getElementById('bar').style.width=((index)/questions.length*100)+'%';
  document.getElementById('question').textContent=item.q;
  const box=document.getElementById('options'); box.innerHTML='';
  item.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.textContent=String.fromCharCode(2456+i)+') '+opt;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.innerHTML='';
  document.getElementById('next').style.display='none';
}
function choose(choice, clicked){
  if(answered) return;
  answered=true;
  const item=questions[index];
  const buttons=[...document.querySelectorAll('.option')];
  buttons.forEach(b=>b.disabled=true);
  buttons[item.a].classList.add('correct');
  if(choice===item.a){
    score++;
    document.getElementById('feedback').className='feedback good';
    document.getElementById('feedback').innerHTML='<b>✓ সঠিক উত্তর!</b><div class="explain">'+item.e+'</div>';
  }else{
    clicked.classList.add('wrong');
    document.getElementById('feedback').className='feedback bad';
    document.getElementById('feedback').innerHTML='<b>✗ ভুল উত্তর</b><div class="explain">সঠিক উত্তর: '+String.fromCharCode(2456+item.a)+') '+item.o[item.a]+'<br>'+item.e+'</div>';
  }
  document.getElementById('next').style.display='block';
  document.getElementById('bar').style.width=((index+1)/questions.length*100)+'%';
}
function nextQuestion(){
  if(index<questions.length-1){ index++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResult();
}
function showResult(){
  document.getElementById('quiz').style.display='none';
  const result=document.getElementById('result');
  const pct=(score/questions.length*100).toFixed(1);
  let msg=score>=108?'অসাধারণ প্রস্তুতি!':score>=90?'খুব ভালো!':score>=72?'ভালো চেষ্টা!':'আরও একবার পুরো syllabus revise করো।';
  result.style.display='block';
  result.innerHTML='<h2>Quiz Completed</h2>'+
    '<div class="scoreCircle"><strong>'+score+'</strong><span>out of 120</span></div>'+
    '<h2>'+pct+'% — '+msg+'</h2>'+
    '<p>সঠিক উত্তর: <b>'+score+'</b><br>ভুল উত্তর: <b>'+(120-score)+'</b></p>'+
    '<button class="restart" onclick="location.reload()">আবার শুরু করুন</button>';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
